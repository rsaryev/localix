# Secret scanning for the full history (`gitleaks git`), run by CI's "Secret scan" job.
# Redaction and exposure-shield tests need secret-shaped fixtures; every value under these paths is
# synthetic. Anything outside them is a finding.
title = "Localix"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic secret-shaped fixtures and content hashes"
paths = [
  '''\.test\.(?:ts|tsx|mjs)$''',
  '''^apps/api/src/features/context-fabric/testing/mini-app-contract-kit\.ts$''',
  # Its earlier name; gone from the tree, but its synthetic fixtures remain in history.
  '''^apps/api/src/features/context-fabric/plugin-contract-kit\.ts$''',
  # Removed with the old vendored runtime, but `gitleaks git` scans history, where its content hashes remain.
  '''^vendor/[^/]+/packages/ai/src/providers/data/\.manifest\.json$''',
]

[[allowlists]]
# An Ed25519 public key: what a signed catalog is checked against, published on purpose. Its private
# half lives only in the marketplace's release secret.
description = "The Localix marketplace's public catalog key"
regexes = ['''bwCq5MPyZb\+OxOHQnaBtzi9GmXBvu1U6WnGeyEPhdXg=''']
