[test]
# Bun reads bunfig.toml only from the directory a run starts in: the same preloads as every
# package, in the order the root bunfig.toml explains.
preload = [
  "./test-deadline.ts",
  "../packages/testing/src/preload/index.ts",
  "../packages/kit/test-preload.ts",
  "./test-globals-guard.ts",
]
