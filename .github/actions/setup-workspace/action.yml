name: Setup workspace
description: Install the pinned Node and Bun toolchains and frozen workspace dependencies

inputs:
  install:
    description: Install workspace dependencies
    default: 'true'
  ignore-scripts:
    description: Disable dependency lifecycle scripts for packaging
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14
        # Hosted executable archives contain absolute paths from a different runner home.
        no-cache: ${{ runner.environment == 'self-hosted' }}

    # A self-hosted runner keeps one Turbo cache on its own disk instead of a GitHub cache
    # archive: restoring that archive cost minutes per job once it had grown to gigabytes. Entries
    # are content-addressed, so a stale one is never replayed; the prune only bounds the disk.
    - name: Use the runner's local Turbo cache
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        dir="$HOME/.cache/localix-turbo"
        mkdir -p "$dir"
        find "$dir" -type f -mtime +7 -delete 2>/dev/null || true
        echo "TURBO_CACHE_DIR=$dir" >> "$GITHUB_ENV"

    - name: Cache dependencies
      if: inputs.install == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        flags=()
        if [ "$IGNORE_SCRIPTS" = true ]; then
          flags+=(--ignore-scripts)
        fi
        for attempt in 1 2 3; do
          bun install --frozen-lockfile "${flags[@]}" && exit 0
          [ "$attempt" = 3 ] && exit 1
          sleep 10
        done
