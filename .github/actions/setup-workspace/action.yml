name: Setup workspace
description: Install the pinned Node and Bun toolchains and frozen workspace dependencies

inputs:
  install:
    description: Install workspace dependencies
    default: 'true'
  ignore-scripts:
    description: Disable dependency lifecycle scripts for packaging
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14

    - name: Cache dependencies
      if: inputs.install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        flags=()
        if [ "$IGNORE_SCRIPTS" = true ]; then
          flags+=(--ignore-scripts)
        fi
        for attempt in 1 2 3; do
          bun install --frozen-lockfile "${flags[@]}" && exit 0
          [ "$attempt" = 3 ] && exit 1
          sleep 10
        done
