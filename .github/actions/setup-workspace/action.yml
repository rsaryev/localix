name: Setup workspace
description: Install the pinned Node and Bun toolchains and frozen workspace dependencies

inputs:
  install:
    description: Install workspace dependencies
    default: 'true'
  ignore-scripts:
    description: Disable dependency lifecycle scripts for packaging
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14
        # Hosted executable archives contain absolute paths from a different runner home.
        no-cache: ${{ runner.environment == 'self-hosted' }}

    # A self-hosted runner keeps its Turbo and Bun package caches on its own disk instead of GitHub
    # cache archives: restoring those cost minutes per job once they had grown to gigabytes. Both
    # are content-addressed, so a stale entry is never used; the prune only bounds the disk. Bun
    # entries are whole package directories, so they are removed whole, never file by file.
    - name: Use the runner's local caches
      if: runner.environment == 'self-hosted'
      shell: bash
      run: | # zizmor: ignore[github-env] constant paths under the runner's own home
        turbo="$HOME/.cache/localix-turbo"
        bun="$HOME/.cache/localix-bun"
        mkdir -p "$turbo" "$bun"
        find "$turbo" -type f -mtime +7 -delete 2>/dev/null || true
        find "$bun" -mindepth 1 -maxdepth 1 -mtime +30 -exec rm -rf {} + 2>/dev/null || true
        echo "TURBO_CACHE_DIR=$turbo" >> "$GITHUB_ENV"
        echo "BUN_INSTALL_CACHE_DIR=$bun" >> "$GITHUB_ENV"

    - name: Cache dependencies
      if: inputs.install == 'true' && runner.environment != 'self-hosted'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        flags=()
        if [ "$IGNORE_SCRIPTS" = true ]; then
          flags+=(--ignore-scripts)
        fi
        for attempt in 1 2 3; do
          bun install --frozen-lockfile "${flags[@]}" && exit 0
          [ "$attempt" = 3 ] && exit 1
          sleep 10
        done
