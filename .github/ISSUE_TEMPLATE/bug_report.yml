name: Bug report
description: Report a reproducible problem or regression in Localix.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first and remove credentials, tokens, private source, and personal data from every attachment. Report suspected vulnerabilities privately through [Security Advisories](https://github.com/rsaryev/localix/security/advisories/new).

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Localix is affected?
      options:
        - Desktop or browser workspace
        - Agent or model runtime
        - Delegation and sub-agents
        - Editor, terminal, preview, or source control
        - Plugin or integration
        - CLI launcher
        - Documentation or website
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
      placeholder: A concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description:
        Include the Localix version or commit, client and launch method, OS, architecture, and
        relevant provider or runtime. For a source checkout, include Bun's version; for the browser
        workspace, include the browser and version.
      placeholder: |
        Localix: <version or commit SHA>
        Client: desktop / browser workspace
        Launch: installed app / bun run dev / bun run dev:web / bun run dev:workspace
        OS: <name and version>
        Architecture: arm64 / x64
        Bun (source checkout):
        Browser (web client):
        Provider or runtime:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description:
        Add the smallest useful log excerpt. Remove secrets and private project data first.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Attach scrubbed visual evidence when it helps explain the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing open and closed issues for this problem.
          required: true
        - label: I removed credentials, tokens, private source, and personal data from the report.
          required: true
        - label: This is a product bug, not a security vulnerability.
          required: true
