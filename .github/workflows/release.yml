name: Desktop Release

# One release pipeline for the desktop app — one distributable product whose
# bundle contains UI + API + CLI. Platform installers and updater bundles are
# published as GitHub Release assets.
#
#   • desktop apps → native installers per platform (.dmg / .AppImage /
#                    .deb), uploaded with signed updater bundles.
# There is no standalone npm release: the CLI, API, UI, and internal runtime
# packages ship inside the desktop bundle.
#
# Trigger: dispatch this reviewed workflow from `main` with a semver tag input.
# Tags do not auto-run release code because a tag can point at an unmerged commit.
#
# Release flow: a DRAFT release is created first → the per-platform matrix builds
# upload their assets → the draft is published only at the end, and the published release is ALWAYS
# the latest one, a `-beta.N` version included: the updater reads `releases/latest/download/latest.json`,
# and GitHub's `latest` skips anything marked a prerelease. The version's label only changes the notes.
#
# Required secrets:
#   Releases are published to this same repository with the workflow's own token
#   (`contents: write` on the three jobs that mutate the release). Create the tag
#   on the commit being released first; the verifier rejects a missing tag or a tag
#   that resolves elsewhere.
# Required for public macOS releases — Developer ID signing + notarization.
# `tauri:release` fails before building when any notarization value is absent:
#   APPLE_CERTIFICATE           — base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  — the .p12 export password
#   APPLE_SIGNING_IDENTITY      — "Developer ID Application: NAME (TEAMID)"
#   APPLE_API_KEY               — App Store Connect API key id
#   APPLE_API_ISSUER            — the API key issuer uuid
#   APPLE_API_KEY_B64           — base64-encoded App Store Connect .p8 file
#   APPLE_API_KEY_PATH is derived from APPLE_API_KEY_B64 at runtime (base64 .p8)
# Required — updater signing. Verification fails before publication if signatures are absent:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Configure the `release` GitHub Environment for main-only deployments with
# required reviewers and keep every release/signing secret scoped only there.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
      legs:
        description:
          'Only build these legs, comma-separated (e.g. linux-x64,macos-arm64); empty builds all'
        required: false
        default: ''

env:
  RELEASE_REPO: rsaryev/localix
  # Shown quietly in the release title; empty for a stable release.
  RELEASE_CHANNEL: beta
  # Platforms this release ships; the updater manifest must hold a signed artifact for each.
  RELEASE_PLATFORMS: darwin-aarch64
  # Built by the same pipeline but never run by hand yet: a leg that fails is reported and left out
  # of the release instead of blocking it, and its updater entry exists only when its artifact does.
  RELEASE_EXPERIMENTAL_PLATFORMS: darwin-x86_64,linux-x86_64,linux-x86_64-deb,linux-aarch64,linux-aarch64-deb
  RUST_TOOLCHAIN: 1.96.1

# Nothing by default; each job below names exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # ── prepare: validate the tag and pin it to one source commit ─────────────────
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    # Waits for CI on the tagged commit (up to 30 min, see require-green-ci.mjs) with room to report.
    timeout-minutes: 40
    # `actions: write` lets it request a CI run for a commit main did not check (a documentation-only
    # push, or a run main superseded); nothing else in this job writes.
    permissions:
      contents: read
      actions: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      commit: ${{ steps.tag.outputs.commit }}
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      - name: Require the protected main workflow
        shell: bash
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Dispatch the release workflow from the protected main branch' >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      # Event inputs are untrusted strings. Pass them as data through the
      # environment, validate strict semver, and resolve the tag to one commit.
      - name: Resolve tagged source
        id: tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          RELEASE_TAG_REF: ${{ github.ref_name }}
        run: bun scripts/resolve-release-ref.mjs >> "$GITHUB_OUTPUT"

      # CI already built, type-checked and tested this exact commit, release tooling included, on
      # push to main (or is asked to now, when main skipped it); repeating any of it here only lengthened the release. Checked here, before
      # the release environment and its signing secrets are reached, so red CI stops the release
      # without touching them.
      - name: Require green CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.tag.outputs.commit }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bun scripts/require-green-ci.mjs

      # Which native legs to build. Empty builds both. Naming legs rebuilds only those: the
      # assets the other legs already uploaded to the draft stay, and the updater manifest is still
      # assembled from the whole release, so a leg that flaked can be redone without redoing the
      # rest. Every requested name must exist, so a typo fails here instead of building nothing.
      - name: Select the build legs
        id: legs
        env:
          LEGS: ${{ inputs.legs }}
        run: |
          # Only macOS on Apple silicon ships for now; Linux and Intel Macs build from source. The
          # parked legs, to re-enable later by adding them back to `all`:
          #   {"os":"ubuntu-22.04","name":"linux-x64","experimental":true}
          #   {"os":"macos-15-intel","name":"macos-x64","experimental":true}
          #   {"os":"ubuntu-22.04-arm","name":"linux-arm64","experimental":true}
          all='[{"os":"macos-15","name":"macos-arm64"}]'
          if [ -z "${LEGS//[[:space:]]/}" ]; then
            matrix="$all"
          else
            matrix=$(jq -c --arg legs "$LEGS" '
              ($legs | split(",") | map(gsub("\\s"; "")) | map(select(length > 0))) as $want
              | ($want - map(.name)) as $unknown
              | if ($unknown | length) > 0 then error("Unknown build leg: " + ($unknown | join(", ")))
                elif ($want | length) == 0 then error("No build legs requested")
                else map(select(.name as $n | $want | index($n))) end
            ' <<<"$all")
          fi
          echo "Building: $(jq -r 'map(.name) | join(", ")' <<<"$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ── verify: changelog and release signing (CI for the tag is checked in prepare) ──
  verify:
    name: Validate changelog and signing
    environment: release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      # This job holds the updater signing key: no dependency lifecycle script runs beside it.
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          ignore-scripts: 'true'

      # The version's CHANGELOG section is what the GitHub release and the app's update dialog
      # say is new. A release without one would announce itself with nothing to read.
      - name: Require release notes in the changelog
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bun scripts/assert-release-changelog.mjs

      # The private key is exposed only to the official Tauri signer invocation.
      - name: Sign updater probe
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          printf '%s\n' 'Localix updater signing probe' > "$RUNNER_TEMP/updater-signing-probe"
          ./node_modules/.bin/tauri signer sign "$RUNNER_TEMP/updater-signing-probe"

      # Against the key the release build embeds (`updater.release.json`, read by the same code that
      # writes the build's overlay), so a secret that installed apps would reject stops the release
      # before a draft exists. The build legs check every real updater bundle the same way.
      - name: Verify probe with shipped public key
        run: bun scripts/verify-updater-signature.mjs "$RUNNER_TEMP/updater-signing-probe"

  draft-release:
    name: Create draft
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      - name: Verify release tag and existing draft
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: bun scripts/verify-release-target.mjs >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.target.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          gh release create "$TAG" --repo "$RELEASE_REPO" --draft --verify-tag \
            --title "Localix $TAG${RELEASE_CHANNEL:+ ($RELEASE_CHANNEL)}" \
            --notes "Localix $TAG. The release notes are written when the release is published.

          Source commit: $SOURCE_COMMIT"

  # ── build-desktop: one NATIVE build per platform → upload installers ─────────
  # Native runners per arch (no cross-compile) so the bundled API sidecar (a real
  # Bun binary staged by prepare-sidecar.mjs, named by the host triple) always
  # matches the target arch.
  build-desktop:
    name: Build ${{ matrix.name }}
    needs: [prepare, verify, draft-release]
    # Preserve the hosted macOS leg and route Linux packaging to Ubuntu 22.04.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    environment: release
    # An experimental leg may fail without holding the release back (see RELEASE_EXPERIMENTAL_PLATFORMS).
    continue-on-error: ${{ matrix.experimental == true }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # The legs come from `prepare` (see "Select the build legs"): both unless the dispatch
        # named some. The first beta ships both, but only macOS has been exercised by hand; the
        # release notes say so. A leg that fails keeps the whole release in draft
        # (`publish-desktop` needs every selected leg), so redo just that leg with the `legs` input.
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          ignore-scripts: 'true'

      - name: Setup desktop
        uses: ./.github/actions/setup-desktop
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: desktop-build

      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key:
            turbo-release-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{
            needs.prepare.outputs.commit }}
          restore-keys: |
            turbo-release-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-release-${{ runner.os }}-

      # `scripts/stamp-version.mjs` owns which files carry the version (tauri.conf.json, Cargo.toml
      # and the crate's Cargo.lock entry) and refuses anything that is not a semantic version.
      - name: Stamp version into the desktop app
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bun scripts/stamp-version.mjs "$RELEASE_VERSION"

      # Prebuild the workspace dependencies and API dist the UI build resolves.
      # prepare-sidecar (tauri beforeBuildCommand) then builds the UI + API sidecar.
      - name: Build workspace packages
        run: bunx turbo build --filter=@localixai/api

      # Bounded like CI's archives: entries untouched for two weeks are dropped before the save.
      - name: Prune Turbo cache
        run: |
          [ -d .turbo/cache ] || exit 0
          find .turbo/cache -type f -mtime +14 -delete

      # Saved here, not after the signing steps: a later failure should not cost the next attempt.
      - name: Save Turbo cache
        if: steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key:
            turbo-release-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{
            needs.prepare.outputs.commit }}

      - name: Decode Apple API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -z "$APPLE_API_KEY_B64" ]; then
            echo "APPLE_API_KEY_B64 is required for a macOS release" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      # prepare-sidecar signs nested native resources from Tauri's beforeBuildCommand.
      # Tauri imports APPLE_CERTIFICATE later, during bundling, so the identity must
      # already exist before the command starts on a clean runner.
      - name: Import Apple signing certificate before sidecar staging
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY are required" >&2
            exit 1
          fi
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/localix-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/localix-signing.keychain-db"
          KEYCHAIN_LIST_PATH="$RUNNER_TEMP/localix-keychain-search-list.txt"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security list-keychains -d user | tr -d '"' | sed 's/^[[:space:]]*//' > "$KEYCHAIN_LIST_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | \
            grep -F -- "$APPLE_SIGNING_IDENTITY"
          # Keychain paths contain no spaces; splitting the list into arguments is intended.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

      # linuxdeploy (the AppImage packager) runs `ldd` on every ELF it finds in the AppDir and
      # aborts when `ldd` exits non-zero. The Bun sidecar is a statically linked executable, for
      # which `ldd` prints "not a dynamic executable" and exits 1, so the AppImage step died with
      # "Failed to run ldd". It calls `/usr/bin/ldd` by absolute path (a shim on PATH was ignored),
      # so the real one moves aside and a wrapper takes its place: it answers "no dynamic
      # dependencies" for exactly that case and passes every other result through untouched.
      - name: Let the AppImage packager accept static executables
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo mv /usr/bin/ldd /usr/bin/ldd.real
          sudo tee /usr/bin/ldd >/dev/null <<'SH'
          #!/bin/sh
          out=$(/usr/bin/ldd.real "$@" 2>&1); code=$?
          if [ "$code" -ne 0 ] && printf '%s' "$out" | grep -q 'not a dynamic executable'; then
            exit 0
          fi
          printf '%s\n' "$out"
          exit "$code"
          SH
          sudo chmod +x /usr/bin/ldd

      # `hdiutil detach` of the DMG's scratch volume times out when Spotlight is still indexing
      # it. Indexing is of no use on a throwaway runner.
      - name: Stop Spotlight indexing so the disk image can detach
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Build desktop release and signed updater artifacts
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The sidecar Bun is the baseline build (no AVX2 needed) on x64, not whichever Bun setup-bun
          # chose for this runner's CPU; arm64 has none and keeps the build's Bun. See sidecar-bun.mjs.
          LOCALIX_SIDECAR_BASELINE: '1'
          # linuxdeploy (the AppImage packager) runs as an AppImage itself and ships an old
          # `strip`: extract-and-run avoids needing FUSE on the runner, and NO_STRIP skips a strip
          # pass that rejects binaries built by a current Rust toolchain. Both are no-ops elsewhere.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        # --verbose: Tauri otherwise hides the packager's own output, which is all that says why a
        # Linux leg failed. macOS gets a second attempt: the disk image twice failed
        # to detach the disk image ("DiskArbitration expired") right after a successful
        # notarization, and the rerun reuses the compiled app, so a retry costs minutes, not a leg.
        shell: bash
        run: |
          cd apps/desktop-tauri
          attempts=1
          [ "$RUNNER_OS" = macOS ] && attempts=2
          for attempt in $(seq 1 "$attempts"); do
            bun run tauri:release --verbose && exit 0
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::tauri:release failed on attempt $attempt of $attempts; retrying"
            fi
          done
          exit 1

      - name: Remove temporary Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/localix-signing.keychain-db"
          KEYCHAIN_LIST_PATH="$RUNNER_TEMP/localix-keychain-search-list.txt"
          if [ -s "$KEYCHAIN_LIST_PATH" ]; then
            ORIGINAL_KEYCHAINS=()
            while IFS= read -r keychain; do
              ORIGINAL_KEYCHAINS+=("$keychain")
            done < "$KEYCHAIN_LIST_PATH"
            security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" || true
          fi
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f \
            "$RUNNER_TEMP/localix-signing.p12" \
            "$RUNNER_TEMP/apple-api-key.p8" \
            "$KEYCHAIN_LIST_PATH"

      # Runs the API out of the app that was just packaged, before anything is uploaded: the same
      # `server.js`, migrations and sidecar Bun a user gets, started the way the shell starts them,
      # then asked for /health and shut down. A bundle that cannot start fails this leg instead of
      # reaching the draft signed and notarized. The Linux leg checks both the AppImage and the .deb.
      - name: Smoke the packaged bundle
        shell: bash
        run: |
          BUNDLE="$PWD/apps/desktop-tauri/src-tauri/target/release/bundle"
          SMOKE=(bun apps/desktop-tauri/scripts/smoke-bundle.mjs)
          case "$RUNNER_OS" in
            macOS)
              "${SMOKE[@]}" --root "$BUNDLE/macos/Localix.app"
              ;;
            Linux)
              work="$RUNNER_TEMP/bundle-smoke"
              rm -rf "$work"
              mkdir -p "$work/appimage" "$work/deb"
              appimage=$(compgen -G "$BUNDLE/appimage/*.AppImage" | head -n 1)
              deb=$(compgen -G "$BUNDLE/deb/*.deb" | head -n 1)
              if [ -z "$appimage" ] || [ -z "$deb" ]; then
                echo "AppImage or .deb missing under $BUNDLE" >&2
                exit 1
              fi
              (cd "$work/appimage" && "$appimage" --appimage-extract >/dev/null)
              dpkg-deb -x "$deb" "$work/deb"
              "${SMOKE[@]}" --root "$work/appimage/squashfs-root"
              "${SMOKE[@]}" --root "$work/deb"
              ;;
          esac

      # What Gatekeeper decides on a user's Mac, asked of the DMG and of the app inside it (the copy
      # people install): a valid signature by this team's Developer ID, a stapled notarization
      # ticket, and acceptance by `spctl`. A leg that fails here uploads nothing.
      - name: Verify macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          team="${APPLE_SIGNING_IDENTITY##*(}"
          team="${team%)}"
          [[ "$team" =~ ^[A-Z0-9]{10}$ ]] || { echo "No team ID in APPLE_SIGNING_IDENTITY" >&2; exit 1; }
          dmg=$(compgen -G 'apps/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg' | head -n 1)
          [ -n "$dmg" ] || { echo "No DMG was built" >&2; exit 1; }
          mount="$RUNNER_TEMP/dmg-check"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null || true' EXIT
          app="$mount/Localix.app"
          codesign --verify --strict --verbose=2 "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          for target in "$dmg" "$app"; do
            codesign -dv "$target" 2>&1 | grep -qx "TeamIdentifier=$team" ||
              { echo "$target is not signed by team $team" >&2; exit 1; }
            xcrun stapler validate "$target"
          done
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Collect release assets
        id: collect
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          BUNDLE="apps/desktop-tauri/src-tauri/target/release/bundle"
          mkdir -p dist-assets
          # Copy every configured installer and signed updater artifact (a Linux arm64 AppImage is
          # named `*_aarch64.AppImage`, its .deb `*_arm64.deb`).
          find "$BUNDLE" -type f \
            \( -name '*.dmg' \
               -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} dist-assets/ \; || true
          # Tauri names the macOS updater tarball WITHOUT an arch tag
          # ("Localix.app.tar.gz"), so the two mac legs would clobber each
          # other's upload and latest.json would key the survivor to the wrong
          # platform. Rename to embed the arch (matches the *aarch64*/*x86_64*
          # cases in the latest.json step). DMGs already carry the arch.
          if [[ "$MATRIX_NAME" == macos-* ]]; then
            ARCH=$([[ "$MATRIX_NAME" == "macos-arm64" ]] && echo aarch64 || echo x86_64)
            shopt -s nullglob
            for f in dist-assets/*.app.tar.gz dist-assets/*.app.tar.gz.sig; do
              base="${f##*/}"
              mv "$f" "dist-assets/${base/.app.tar.gz/_${ARCH}.app.tar.gz}"
            done
          fi
          require_match() {
            compgen -G "$1" >/dev/null || {
              echo "Missing required release artifact for $MATRIX_NAME: $1" >&2
              exit 1
            }
          }
          case "$MATRIX_NAME" in
            macos-*)
              require_match 'dist-assets/*.dmg'
              require_match 'dist-assets/*.app.tar.gz'
              require_match 'dist-assets/*.app.tar.gz.sig'
              ;;
            linux-*)
              require_match 'dist-assets/*.AppImage'
              require_match 'dist-assets/*.AppImage.sig'
              # A .deb install updates from its own signed package (`linux-<arch>-deb`
              # in latest.json); without the signature it would be stranded on the
              # AppImage fallback, which the deb installer rejects.
              require_match 'dist-assets/*.deb'
              require_match 'dist-assets/*.deb.sig'
              ;;
          esac
          # Stable-name copies of the installer people download. Tauri puts the version in the
          # installer's name, so a link to it changes with every release; the landing page links to
          # `releases/latest/download/<stable name>` instead, which GitHub resolves to the newest
          # published release. These names are mirrored by `STABLE_INSTALLER_NAMES` in
          # apps/landing/src/components/downloadOptions.ts, and a landing test keeps them in step.
          # The versioned installers stay: the updater manifest is built from those.
          stable_copy() {
            local source
            source=$(compgen -G "$1" | head -n 1)
            [ -n "$source" ] || { echo "No installer matching $1 to copy as $2" >&2; exit 1; }
            cp "$source" "dist-assets/$2"
          }
          case "$MATRIX_NAME" in
            macos-arm64) stable_copy 'dist-assets/*.dmg' Localix-macos-arm64.dmg ;;
            macos-x64) stable_copy 'dist-assets/*.dmg' Localix-macos-x64.dmg ;;
            linux-x64) stable_copy 'dist-assets/*.AppImage' Localix-linux-x64.AppImage ;;
            linux-arm64) stable_copy 'dist-assets/*.AppImage' Localix-linux-arm64.AppImage ;;
          esac
          echo "Collected:"; ls -la dist-assets || true

      # Signed statements of which commit and workflow built each file, checkable with
      # `gh attestation verify`. Attestations need a public repository (or GitHub Enterprise).
      # What an installed app checks before it installs an update: every updater bundle's signature
      # against the public key the build embedded. A bundle no app would accept never reaches the
      # draft, and `latest.json` is built only from bundles that passed.
      - name: Verify updater signatures
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(dist-assets/*.app.tar.gz dist-assets/*.AppImage dist-assets/*.deb)
          [ ${#bundles[@]} -gt 0 ] || { echo "No updater bundles to verify" >&2; exit 1; }
          bun scripts/verify-updater-signature.mjs "${bundles[@]}"

      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-assets/*
            !dist-assets/*.sig

      - name: Upload release assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          shopt -s nullglob
          FILES=(dist-assets/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release assets produced for $MATRIX_NAME" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            "${FILES[@]}" --clobber --repo "$RELEASE_REPO"

  # ── mini-app-kit: what mini apps are built against, as this release's asset ────
  # Localix ships and hosts no mini app (rule X5) and carries no kit: the Localix marketplace
  # publishes its own catalog, and each mini app installs the kit of the release it is built
  # against. The kit is staged and checked without write access, the marketplace's mini apps are
  # checked against it, and only then is it published.
  mini-app-kit-stage:
    name: Stage mini app kit
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build workspace packages
        run: bunx turbo build --filter=@localixai/api

      # `mini-app-kit.tar.gz`, `kit.json` at its root, checked against SHA256SUMS.txt
      # (publish-desktop names it there).
      - name: Stage the mini app kit
        shell: bash
        env:
          # This job's checkout is unstamped: the kit and its package carry the release's version.
          LOCALIX_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bun scripts/stage-mini-app-kit.mjs . "$RUNNER_TEMP/mini-app-kit"
          # The kit says exactly what the committed contract says, or nothing is published.
          bun scripts/check-mini-app-contract.mjs --kit "$RUNNER_TEMP/mini-app-kit"
          tar -czf "$RUNNER_TEMP/mini-app-kit.tar.gz" -C "$RUNNER_TEMP/mini-app-kit" .

      - name: Keep the kit for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mini-app-kit
          path: ${{ runner.temp }}/mini-app-kit.tar.gz
          retention-days: 3

  # The mini apps people already run, checked against the kit before it is published: a kit that
  # breaks one stops the release. Their code runs here, where nothing can be written.
  mini-apps-against-kit:
    name: Mini apps against the kit
    needs: [prepare, mini-app-kit-stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Only for the pinned Bun: nothing of this checkout runs.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      - name: Take the staged kit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mini-app-kit
          path: ${{ runner.temp }}

      - name: The Localix marketplace's mini apps
        shell: bash
        env:
          MINI_APP_KIT: ${{ runner.temp }}/kit
        run: |
          set -euo pipefail
          mkdir -p "$MINI_APP_KIT"
          tar -xzf "$RUNNER_TEMP/mini-app-kit.tar.gz" -C "$MINI_APP_KIT"
          git clone --depth 1 https://github.com/rsaryev/localix-marketplace "$RUNNER_TEMP/marketplace"
          cd "$RUNNER_TEMP/marketplace"
          bun install --frozen-lockfile
          bun run check mini-apps

  mini-app-kit:
    name: Mini app kit
    needs: [prepare, draft-release, mini-apps-against-kit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      - name: Take the staged kit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mini-app-kit
          path: ${{ runner.temp }}

      - name: Upload the mini app kit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/mini-app-kit.tar.gz" --clobber --repo "$RELEASE_REPO"

  # ── publish-desktop: flip the draft to the public "latest" release ───────────
  publish-desktop:
    name: Publish release
    needs: [prepare, build-desktop, mini-app-kit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      - name: Reverify release tag and draft provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: bun scripts/verify-release-target.mjs

      # Assemble the updater manifest ONCE, after every platform leg has uploaded
      # its signed artifacts, so parallel matrix uploads can't clobber it. Each
      # `<artifact>.sig` on the release is a detached minisign signature (produced
      # by `createUpdaterArtifacts`); we pair it with its download URL and emit the
      # `latest.json` the `plugins.updater.endpoints` URL resolves to. Requires the
      # signing key (TAURI_SIGNING_PRIVATE_KEY) to have been set on the build legs.
      # Missing signatures are a failed release, never a silently broken updater.
      - name: Generate updater latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SIGNATURE_DIR: ${{ github.workspace }}/updater/signatures
          RELEASE_ASSET_LIST: ${{ github.workspace }}/updater/assets.txt
          RELEASE_OUTPUT: ${{ github.workspace }}/updater/latest.json
          RELEASE_CHANGELOG: ${{ github.workspace }}/CHANGELOG.md
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_SIGNATURE_DIR"
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" \
            --pattern '*.sig' --dir "$RELEASE_SIGNATURE_DIR"
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" \
            --json assets --jq '.assets[].name' > "$RELEASE_ASSET_LIST"
          RELEASE_PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RELEASE_PUBLISHED_AT
          bun scripts/build-updater-manifest.mjs
          gh release upload "$RELEASE_TAG" "$RELEASE_OUTPUT" \
            --clobber --repo "$RELEASE_REPO"

      # The release `latest` currently points to, or nothing before the first release. Only a 404
      # means "none": any other failure stops here, because an empty answer would let the order check
      # below pass. (`gh api` prints the error body on stdout, so it is never read as a tag.)
      - name: Find the current latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/$RELEASE_REPO/releases/latest" --jq .tag_name 2>&1); then
            tag="$out"
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            tag=''
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi
          echo "Current latest release: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Checksums of every installer, updater bundle and the mini app kit that reached the release,
      # so a leg that failed is simply absent. GitHub records each asset's SHA-256 on upload, so nothing is
      # downloaded again. The notes are written from the same asset list, so their download table
      # never offers a file the release does not have.
      - name: Write checksums and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          PREVIOUS_TAG: ${{ steps.latest.outputs.tag }}
          RELEASE_ASSET_LIST: ${{ github.workspace }}/updater/published-assets.txt
          RELEASE_CHANGELOG: ${{ github.workspace }}/CHANGELOG.md
          RELEASE_GENERATED_NOTES: ${{ github.workspace }}/updater/generated-notes.md
        run: |
          set -euo pipefail
          gh api "repos/$RELEASE_REPO/releases?per_page=100" --jq '
            [.[] | select(.tag_name == env.RELEASE_TAG) | .assets[]
              | select(.name | test("(\\.(dmg|AppImage|deb|app\\.tar\\.gz)|^mini-app-kit\\.tar\\.gz)$"))]
            | if length == 0 or any(.digest == null) then error("assets without a SHA-256 digest")
              else sort_by(.name)[] | "\(.digest | ltrimstr("sha256:"))  \(.name)" end
          ' > "$RUNNER_TEMP/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/SHA256SUMS.txt" \
            --clobber --repo "$RELEASE_REPO"

          # Grouped by the labels in .github/release.yml; without a previous tag, from the start.
          args=(-f "tag_name=$RELEASE_TAG" -f "target_commitish=$SOURCE_COMMIT")
          [ -n "$PREVIOUS_TAG" ] && args+=(-f "previous_tag_name=$PREVIOUS_TAG")
          gh api -X POST "repos/$RELEASE_REPO/releases/generate-notes" "${args[@]}" \
            --jq .body > "$RELEASE_GENERATED_NOTES"

          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" \
            --json assets --jq '.assets[].name' > "$RELEASE_ASSET_LIST"
          bun scripts/build-release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
          tail -n +3 "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/release-body.md"
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" \
            --title "$(head -n 1 "$RUNNER_TEMP/release-notes.md")" \
            --notes-file "$RUNNER_TEMP/release-body.md"

      # One line of releases, and the one just published is the latest: `latest.json` resolves through
      # `releases/latest`, so a release that is not latest is a release no installed app can update to.
      # Publishing a version that is not newer than the current latest would move users backwards (or
      # strand them: the updater never installs an older version), so that is refused first.
      - name: Publish release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          CURRENT_LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          bun scripts/verify-release-target.mjs
          bun scripts/assert-newest-release.mjs
          gh release edit "$TAG" --repo "$RELEASE_REPO" --verify-tag \
            --draft=false --prerelease=false --latest

      # A release published with the workflow token does not trigger `release: published`
      # workflows, so the landing would keep its "coming soon" buttons. Dispatch it explicitly,
      # The landing resolves the newest published release on its own.
      - name: Refresh the landing download buttons
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run landing.yml --repo "$RELEASE_REPO" --ref main -f production=true
