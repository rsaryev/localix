name: Website Deploy

# Builds the website, site/ (made from the llx-sitekit template), and deploys it to Cloudflare
# Pages (project localix-studio, serving studio.localix.ai), the same way the
# desktop release is built: in GitHub Actions, then uploaded as a finished folder. Pages' own Git
# integration is not used, so a deploy only ever happens from a build this workflow verified.
#
# It runs only by hand (Actions → Website Deploy → Run workflow), and from the release workflow
# once a release is published, never on a push or a pull request: the site only needs the newest
# build. The download button links the newest release's installer by a name with no version in
# it, so a build never has to be told which release is out.
#
#   • production off → a preview deployment (branch preview, at a *.pages.dev address)
#   • production on  → the production site, when LANDING_PRODUCTION=true is also set
#
# Until the variable is set, every run deploys a preview and the live site is left alone.
#
# Needs: secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy to production (needs LANDING_PRODUCTION=true as well)'
        type: boolean
        default: false

permissions:
  contents: read

# Deployments queue instead of cancelling: two in flight could finish in the wrong order, and an
# older build would replace the newer page.
concurrency:
  group: landing-production
  cancel-in-progress: false

env:
  PAGES_PROJECT: localix-studio
  WRANGLER_VERSION: 4.161.0

jobs:
  deploy:
    name: Deploy website
    # Our own runner; the workflow runs only by hand, never for a pull request.
    runs-on: localix
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Bun alone: the site has its own install, in site/, and needs none of the workspace's.
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      - name: Check the deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not set" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not set" >&2; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The target decides the Pages branch: main is production, anything else a preview.
      - name: Decide the target
        id: target
        env:
          PRODUCTION_ENABLED: ${{ vars.LANDING_PRODUCTION }}
          DISPATCH_PRODUCTION: ${{ inputs.production }}
        run: |
          want_production=false
          [ "$DISPATCH_PRODUCTION" = "true" ] && want_production=true
          if [ "$want_production" = "true" ] && [ "$PRODUCTION_ENABLED" = "true" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "branch=preview" >> "$GITHUB_OUTPUT"
            # An if, not `[ ] && echo`: as the step's last command that would fail it on a preview.
            if [ "$want_production" = "true" ]; then
              echo "::notice::Production deploys are off (set the repository variable LANDING_PRODUCTION=true); deploying a preview instead."
            fi
          fi

      # The check is the build: the layers, the types, the docs' standard (a broken link or anchor
      # fails it), then the landing and every docs page prerendered into site/dist.
      - name: Build website
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun --bun run check

      # What the page runs on (React, xterm.js) travels with it, as with the desktop app.
      - name: Stage third-party notices
        run: bun scripts/stage-third-party-notices.mjs site site/dist

      # On Bun: wrangler's launcher starts `#!/usr/bin/env node`, and this runner has no Node.
      - name: Deploy website
        id: deploy
        run: |
          bunx --bun "wrangler@$WRANGLER_VERSION" pages deploy site/dist \
            --project-name="$PAGES_PROJECT" --branch="$TARGET_BRANCH" \
            --commit-hash="$GITHUB_SHA" --commit-dirty=false > deploy.out 2>&1 || { cat deploy.out >&2; exit 1; }
          cat deploy.out
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.out | tail -n 1)
          test -n "$url" || { echo "No deployment address in wrangler's output" >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}

      - name: Write the deployment summary
        env:
          TARGET_ENVIRONMENT: ${{ steps.target.outputs.environment }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Website deployed"
            echo ""
            echo "- Target: \`$TARGET_ENVIRONMENT\`"
            echo "- Deployment: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
