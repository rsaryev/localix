name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: Also run the workspace unit tests and the global isolation check
        type: boolean
        default: false

# Read-only token and no secrets: a pull request from a fork runs the same checks safely.
permissions:
  contents: read

# A newer run of the same ref supersedes the older one: these jobs only report on the current
# tree, so an in-flight run for a stale commit is wasted runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Repository validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep zsh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Keep CI identical to package.json#packageManager; "latest" made a
          # toolchain release able to break main without any repository change.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Turbo's local cache covers build, type-check and type-check:tests. A restored entry is
      # keyed on the task's input hash, so a stale entry is never replayed; the key only decides
      # which archive to start from.
      - name: Restore Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-

      # Before the gates, not after them: architecture runs the API's plugin inspection, type-check
      # reads workspace packages through their `dist`, and dead-code resolves generated modules. On
      # a clean checkout all three failed while `dist` and the generated output did not exist yet.
      - name: Build
        run: bun run build

      - name: Check vendored workspaces
        run: bun run check:vendor

      - name: Check static public-repository hygiene
        run: bun run check:public

      - name: Check release provenance and updater manifest
        run: bun run check:release

      - name: Check architecture boundaries
        run: bun run check:architecture

      - name: Check subsystem source references
        run: bun run check:docs

      - name: Check committed generated output
        run: bun run check:generated

      - name: Audit lockfile dependencies
        run: bun run check:audit

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run type-check

      - name: Typecheck tests
        run: bun run check:tests

      - name: Lint
        run: bun run lint

      - name: Check dead code and dependency graph
        run: bun run check:deadcode

      - name: Validate bundled plugin manifests and files
        run: bun run check:plugins

      # Workspace unit tests (`turbo test`, ~9 min) and the full-suite global isolation check
      # (`check:globals`, which reruns them) are off the automatic path. Run `bun run test` and
      # `bun run check:globals` locally, or trigger this workflow manually with run_unit_tests.
      - name: Run repository contract tests
        run: bun run test:repo

      - name: Run unit tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_unit_tests
        run: bun run test

      - name: Check full-suite global isolation
        if: github.event_name == 'workflow_dispatch' && inputs.run_unit_tests
        run: bun run check:globals

      - name: Run drop-in plugin tests
        run: bun run test:dropins

  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    env:
      RUST_TOOLCHAIN: 1.96.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential file

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"

      # Clippy over the Tauri dependency graph is ~15 minutes from cold. The cache
      # is keyed on the lockfile, so a dependency change still rebuilds honestly.
      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './apps/desktop-tauri/src-tauri -> target'

      - name: Check Rust
        run: bun run check:rust
