      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Keep CI identical to package.json#packageManager; "latest" made a
          # toolchain release able to break main without any repository change.
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
