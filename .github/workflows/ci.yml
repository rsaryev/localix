          restore-keys: |
            turbo-typecheck-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-typecheck-${{ runner.os }}-

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run type-check

      - name: Typecheck tests
        run: bun run check:tests

      - name: Save Turbo cache
        if: always() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}

  unit-ui:
    name: Unit tests (ui)
    runs-on: ubuntu-latest

    steps:
