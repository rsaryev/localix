name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token and no secrets: a pull request from a fork runs the same checks safely.
permissions:
  contents: read

# Check the newest tree for each ref; superseded pushes and pull requests stop consuming minutes.
# A manual run remains independent and is never cancelled by a push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# JavaScript gates share one install, build and Turbo cache. Rust runs separately.
# `Repository validation` remains the required check and fails unless every gate passed.
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A pull request is checked out as a merge commit; its first parent is the base tip,
          # so two commits are enough to list exactly what the pull request changes.
          fetch-depth: 2

      # Only a pull request may skip the Rust gate, and only when nothing it reads changed: the
      # shell under apps/desktop-tauri, the lockfile and root manifest that pin the sidecar Bun,
      # and this workflow. Pushes to main and manual runs always run it.
      - name: Decide whether the Rust gate must run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          rust=true
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            changed=$(git diff --name-only 'HEAD^1' HEAD)
            if ! printf '%s\n' "$changed" |
              grep -Eq '^(apps/desktop-tauri/|package\.json$|bun\.lock$|\.github/workflows/ci\.yml$)'; then
              rust=false
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "Rust gate: $rust"

  static:
    name: JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install runtime test dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep zsh && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Keep CI identical to package.json#packageManager; "latest" made a
          # toolchain release able to break main without any repository change.
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        # Retried: a registry or mirror hiccup is the usual reason for a red install, and a real
        # lockfile mismatch fails all three attempts within seconds.
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

      # An entry is keyed on the task's input hash inside Turbo, so a stale one is never replayed;
      # this key only picks which archive to start from. Saved with `always()`: a failing run still
      # leaves the tasks that passed warm for the next push.
      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-js-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-js-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-js-${{ runner.os }}-

      # Before the gates, not after them: architecture runs the API's plugin inspection, type-check
      # reads workspace packages through their `dist`, and dead-code resolves generated modules. On
      # a clean checkout all three failed while `dist` and the generated output did not exist yet.
      - name: Build
        run: bun run build

      - name: Check vendored workspaces
        run: bun run check:vendor

      - name: Check static public-repository hygiene
        run: bun run check:public

      - name: Check release provenance and updater manifest
        run: bun run check:release

      - name: Check architecture boundaries
        run: bun run check:architecture

      - name: Check subsystem source references
        run: bun run check:docs

      - name: Check committed generated output
        run: bun run check:generated

      - name: Audit lockfile dependencies
        run: bun run check:audit

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Check dead code and dependency graph
        run: bun run check:deadcode

      - name: Validate bundled plugin manifests and files
        run: bun run check:plugins

      - name: Typecheck
        run: bun run type-check

      - name: Typecheck tests
        run: bun run check:tests

      - name: Run workspace and repository contract tests
        run: bun run test

      - name: Check full-suite global isolation
        run: bun run check:globals

      - name: Run drop-in plugin tests
        run: bun run test:dropins

      # Stages the desktop bundle and starts its API from a copy outside the checkout, the way the
      # packaged app does. A missing resource or an unresolved vendored module shows up here on the
      # pull request instead of in a release leg that has already been signed and notarized.
      - name: Smoke the staged desktop bundle
        run: bun run check:bundle

      - name: Save Turbo cache
        if: always() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-js-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}

  rust:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: 1.96.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential file

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        # Retried: a registry or mirror hiccup is the usual reason for a red install, and a real
        # lockfile mismatch fails all three attempts within seconds.
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"

      # Clippy over the Tauri dependency graph is ~15 minutes from cold. The cache
      # is keyed on the lockfile, so a dependency change still rebuilds honestly.
      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: './apps/desktop-tauri/src-tauri -> target'

      - name: Check Rust
        run: bun run check:rust

  ci:
    name: Repository validation
    if: always()
    needs: [changes, static, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` is accepted for the Rust job alone, and only because `changes` succeeded and
      # said nothing it reads changed; any other skipped or cancelled job fails the check.
      - name: Require every job to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo '### Job results'
            echo '| job | result |'
            echo '| --- | --- |'
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e '
            to_entries | all(
              .value.result == "success"
              or (.key == "rust" and .value.result == "skipped")
            )
          ' >/dev/null
