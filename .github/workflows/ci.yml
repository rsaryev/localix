name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token and no secrets: a pull request from a fork runs the same checks safely.
permissions:
  contents: read

# A newer run of the same ref supersedes the older one: these jobs only report on the current
# tree, so an in-flight run for a stale commit is wasted runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The gates run as parallel jobs, so a run takes as long as its slowest job rather than the sum.
# `Repository validation` at the end is the one required check: it fails unless every job passed.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Keep CI identical to package.json#packageManager; "latest" made a
          # toolchain release able to break main without any repository change.
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # An entry is keyed on the task's input hash inside Turbo, so a stale one is never replayed;
      # this key only picks which archive to start from. Saved with `always()`: a failing run still
      # leaves the tasks that passed warm for the next push.
      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-static-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-static-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-static-${{ runner.os }}-

      # Before the gates, not after them: architecture runs the API's plugin inspection, type-check
      # reads workspace packages through their `dist`, and dead-code resolves generated modules. On
      # a clean checkout all three failed while `dist` and the generated output did not exist yet.
      - name: Build
        run: bun run build

      - name: Check vendored workspaces
        run: bun run check:vendor

      - name: Check static public-repository hygiene
        run: bun run check:public

      - name: Check release provenance and updater manifest
        run: bun run check:release

      - name: Check architecture boundaries
        run: bun run check:architecture

      - name: Check subsystem source references
        run: bun run check:docs

      - name: Check committed generated output
        run: bun run check:generated

      - name: Audit lockfile dependencies
        run: bun run check:audit

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Check dead code and dependency graph
        run: bun run check:deadcode

      - name: Validate bundled plugin manifests and files
        run: bun run check:plugins

      - name: Save Turbo cache
        if: always() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-static-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      TURBO_CONCURRENCY: 100%

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
