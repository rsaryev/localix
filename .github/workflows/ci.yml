name: Checks

on:
  pull_request:
  # Documentation and media alone change nothing the checks read. A release whose commit has no run
  # asks for one (scripts/require-green-ci.mjs), so skipping them leaves no commit unverified.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
  workflow_dispatch:

# No job gets more than it asks for; every job below reads the repository and nothing else.
permissions: {}

env:
  RUST_TOOLCHAIN: 1.96.1

# A pull request keeps only its newest run: a new push cancels the one in progress. Main runs one
# CI at a time and keeps only the newest waiting one, so a burst of pushes costs the first run and
# the last, never one per commit; a run in progress is never cancelled, so its cache is saved. A
# release whose commit was skipped asks for a run of its own (a manual run, a group per sha).
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number)
    || github.event_name == 'push' && 'ci-main' || format('ci-{0}-{1}', github.event_name,
    github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `app` checks the JavaScript workspace as four parallel jobs (types, unit tests, integration and
# repository tests, desktop bundle); each builds from its own Turbo cache rather than waiting on a
# shared build job, which would only lengthen the critical path. `desktop` scans the repository and
# checks the Rust shell. `checks` is the one result branch protection requires.
jobs:
  app:
    name: App (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      # Every slice reports: one failing slice must not hide what the others found.
      fail-fast: false
      matrix:
        include:
          - check: types
            cache: types
            run: |
              bun run type-check
              bun run check:tests
              bun run check:size
          - check: unit tests
            cache: unit
            run: bun run test
          # Real processes, PTYs and watchers: every package's test:integration, the scripts
          # workspace's included.
          - check: integration tests
            cache: integration
            run: bun run test:integration
          # Stages the desktop bundle and starts its API from a copy outside the checkout, the way
          # the packaged app does: a missing resource or an unresolved vendored module shows up
          # here instead of in a release leg that has already been signed and notarized.
          - check: desktop bundle
            cache: bundle
            run: bun run check:bundle
          # Every package's unit tests under coverage: each package holds its recorded floor, no
          # source file goes untested, and a pull request's changed lines are run by tests
          # (docs/internals/testing.md#coverage).
          - check: coverage
            cache: coverage
            run: bun run coverage
    # A pull request checks and tests only the packages it changes and their dependents (Turbo's
    # --affected against its base; a global input selects everything). Main deliberately checks
    # the whole tree, unfiltered, so every main commit has a full run a release can rely on. The
    # build is never filtered: the repository tests import built packages, and Turbo replays what
    # main already built.
    env:
      TURBO_FILTER: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      # History only where it is read: --affected needs the pull request's base; main runs the
      # whole tree from one commit.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Install ripgrep and zsh for tests
        if: matrix.cache == 'unit' || matrix.cache == 'integration' || matrix.cache == 'coverage'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep zsh && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # One archive per slice, so a slice restores the task outputs it replays. An entry is keyed on
      # the task's input hash inside Turbo, so a stale one is never replayed; this key only picks
      # which archive to start from.
      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key:
            turbo-${{ matrix.cache }}-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha
            }}
          restore-keys: |
            turbo-${{ matrix.cache }}-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ matrix.cache }}-${{ runner.os }}-

      # Type checks and tests read workspace declarations and bundles from the build output.
      - name: Build workspace packages
        run: bun run build

      - name: Setup Rust for the bundle check
        if: matrix.cache == 'bundle'
        uses: ./.github/actions/setup-desktop
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          build-native: 'false'

      # A slice runs several commands, so they run under -e: the first to fail stops the slice
      # (without it only the LAST command's status counted). The log is kept for the summary below,
      # and the step's pipefail keeps the slice's status through tee.
      - name: Check ${{ matrix.check }}
        shell: bash
        env:
          CHECK: ${{ matrix.run }}
        run: bash -eo pipefail -c "$CHECK" 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Summarise failures
        if: failure()
        env:
          TITLE: App (${{ matrix.check }})
        run:
          bun scripts/ci-failure-summary.mjs "$TITLE" "$RUNNER_TEMP/check.log" >>
          "$GITHUB_STEP_SUMMARY"

      # The archive is restored and saved again on every main push, so without a bound it only
      # grows. Entries untouched for two weeks are dropped; a task that still needs one rebuilds it.
      - name: Prune Turbo cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          [ -d .turbo/cache ] || exit 0
          find .turbo/cache -type f -mtime +14 -delete
          du -sh .turbo/cache

      # Only main writes an archive, as with the Rust cache: pull requests restore main's and
      # cannot evict it from the repository's 10 GB cache quota with per-commit entries. Saved with
      # `always()`: a failing run still leaves the tasks that passed warm for the next push.
      - name: Save Turbo cache
        if: >-
          always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key:
            turbo-${{ matrix.cache }}-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha
            }}

  desktop:
    name: Desktop (Rust) and repository scans
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      # Full history for the secret scan; the merge commit's parents for change detection.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Before the scans: the same base decides how much history they read, and the Rust gate is
      # skipped only when nothing it reads changed: the shell under
      # apps/desktop-tauri, the lockfile and root manifest that pin the sidecar Bun, and shared CI
      # setup. A pull request compares its merge commit's parents; a push to main compares the
      # commits since main's last successful run, not just the push's own, because main skips
      # runs (a newer push replaces a waiting one) and a skipped push's commits still need
      # checking. A manual run, or a push with no successful run to compare with (or one a
      # force-push erased), always runs it. A release compiles the Rust shell itself, so a skipped
      # gate never ships unchecked Rust.
      - name: Detect Rust input changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=''
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            base='HEAD^1'
          elif [ "$EVENT" = push ]; then
            last=$(gh run list --workflow ci.yml --branch main --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
              base="$last"
            fi
          fi
          rust=true
          if [ -n "$base" ] && ! git diff --name-only "$base" HEAD |
            grep -Eq '^(apps/desktop-tauri/|package\.json$|bun\.lock$|\.nvmrc$|\.github/workflows/ci\.yml$|\.github/actions/(setup-workspace|setup-desktop)/)'; then
            rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # Workflows are linted only when a change reaches them (or when nothing is known).
          workflows=true
          if [ -n "$base" ] && ! git diff --name-only "$base" HEAD | grep -Eq '^\.github/'; then
            workflows=false
          fi
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"
          echo "Rust gate: $rust (compared with ${base:-nothing})"

      # Checksummed release binaries instead of their actions: the gitleaks action needs a licence
      # key for organisation repositories, and a binary is one download with nothing to trust but
      # its hash. actionlint checks workflow syntax and expressions; zizmor checks workflow security
      # (injection, permissions, credential persistence).
      - name: Install pinned scanners
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.31.0
          ZIZMOR_SHA256: 95776c59c2d4c0d6e10560647b4830762b8dbcca8d7d9b7469ff227c73a6fee6
        run: |
          fetch() {
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$2" "$1/$2"
            echo "$3  $RUNNER_TEMP/$2" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/$2" -C "$RUNNER_TEMP" "$4"
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION" \
            "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256" gitleaks
          fetch "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION" \
            "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256" actionlint
          fetch "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION" \
            zizmor-x86_64-unknown-linux-gnu.tar.gz "$ZIZMOR_SHA256" zizmor

      # Each commit is scanned once, when it arrives: only the commits since the base (a pull
      # request's, or a push's `before`). With no base the whole history is scanned.
      - name: Scan history for secrets
        env:
          BASE: ${{ steps.filter.outputs.base }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml \
            ${BASE:+--log-opts="$BASE..HEAD"} .

      - name: Lint workflows
        if: steps.filter.outputs.workflows == 'true'
        run: |
          "$RUNNER_TEMP/actionlint" -color
          "$RUNNER_TEMP/zizmor" --offline --min-severity medium .github

      - name: Setup workspace
        if: steps.filter.outputs.rust == 'true'
        uses: ./.github/actions/setup-workspace

      - name: Setup Rust and native build dependencies
        if: steps.filter.outputs.rust == 'true'
        uses: ./.github/actions/setup-desktop
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Check and test Rust
        if: steps.filter.outputs.rust == 'true'
        run: bun run check:rust

  # The single required status: it fails when any job above failed or was cancelled, and passes
  # when they passed or were skipped on purpose.
  checks:
    name: Checks passed
    if: always()
    needs: [app, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Require every check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Name each job and its result, so a red check says which job to open.
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

      # Every main run saves one archive per slice under a key of its own, and the repository's
      # cache quota is 10 GB: left alone the archives fill it and evict the ones still in use. A
      # restore starts from the newest archive of its slice, so the older ones are dropped here, after
      # every job that saves has finished. Only this step holds the token's write access.
      - name: Drop superseded Turbo archives
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for slice in types unit integration bundle coverage; do
            gh cache list --key "turbo-$slice-" --sort created_at --order desc --limit 100 \
              --json id --jq '.[1:][].id' |
              xargs -r -n1 gh cache delete || true
          done
