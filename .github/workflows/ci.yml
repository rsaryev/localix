        with:
          # Keep CI identical to package.json#packageManager; "latest" made a
          # toolchain release able to break main without any repository change.
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # An entry is keyed on the task's input hash inside Turbo, so a stale one is never replayed;
      # this key only picks which archive to start from. Saved with `always()`: a failing run still
      # leaves the tasks that passed warm for the next push.
      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-typecheck-${{ runner.os }}-

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run type-check

      - name: Typecheck tests
        run: bun run check:tests

      - name: Save Turbo cache
        if: always() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}

  unit-ui:
    name: Unit tests (ui)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep zsh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
