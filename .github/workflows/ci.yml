          key: turbo-dropins-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}

  rust:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: 1.96.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential file

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"

      # Clippy over the Tauri dependency graph is ~15 minutes from cold. The cache
      # is keyed on the lockfile, so a dependency change still rebuilds honestly.
      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './apps/desktop-tauri/src-tauri -> target'

      - name: Check Rust
        run: bun run check:rust

  ci:
    name: Repository validation
    if: always()
    needs:
      [changes, static, typecheck, unit-ui, unit-api, unit-rest, contract, globals, dropins, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` is accepted for the Rust job alone, and only because `changes` succeeded and
      # said nothing it reads changed; any other skipped or cancelled job fails the check.
      - name: Require every job to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            to_entries | all(
              .value.result == "success"
              or (.key == "rust" and .value.result == "skipped")
            )
          ' >/dev/null
