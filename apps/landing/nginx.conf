server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # RFC 9727 API catalog. The file deliberately has no extension, so nginx finds
  # no mime.types entry and would answer with the default octet-stream type — a
  # linkset no client would parse. Declare the type the RFC registers.
  location = /.well-known/api-catalog {
    default_type application/linkset+json;
  }

  location = /docs {
    return 302 /docs/getting-started--what-is-localix;
  }

  # Each generated docs URL has its own static HTML shell and metadata. Unknown
  # docs must be a real 404 rather than the homepage disguised by the SPA.
  location /docs/ {
    try_files $uri.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
