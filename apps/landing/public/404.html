<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Page not found · Localix Studio</title>
    <style>
      :root {
        --bg: #0b0b0d;
        --fg: #ececf1;
        --muted: #9a9aa6;
        --line: #26262c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      img {
        width: 40px;
        height: 40px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      nav {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        color: var(--fg);
        text-decoration: none;
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      a:hover,
      a:focus-visible {
        border-color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="" />
      <h1>Page not found</h1>
      <p>There is no page at this address. It may have moved, or the link is mistyped.</p>
      <nav><a href="/">Home</a><a href="/docs">Docs</a></nav>
    </main>
  </body>
</html>
