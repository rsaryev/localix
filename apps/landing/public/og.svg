<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Localix — One workspace for you and a team of agents</title>
  <!-- Kept in sync with the product sentence in index.html / README. The card mirrors the
       homepage: the headline with the bird beside it, and the demo's app window rising from the
       bottom edge. `og.png` is rendered from this file with the landing's own fonts. -->
  <desc id="description">Localix is an open source Agentic Development Environment: one workspace where you and a team of agents share the editor, terminals, preview, and databases.</desc>
  <defs>
    <clipPath id="window">
      <rect x="80" y="292" width="1040" height="420" rx="18" />
    </clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#070707" stop-opacity="0" />
      <stop offset="1" stop-color="#070707" stop-opacity="0.85" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#070707" />
  <g font-family="Localix Landing Heading, DM Sans Variable, DM Sans, Inter, Helvetica Neue, Arial, sans-serif" fill="#f4f4f5" font-weight="600" font-size="72" letter-spacing="-2">
    <text x="80" y="174">Everything is context</text>
  </g>
  <image href="logo.svg" x="980" y="70" width="140" height="140" />
  <g clip-path="url(#window)">
    <image href="films/demo.jpg" x="80" y="292" width="1040" height="791" preserveAspectRatio="xMidYMin slice" />
    <rect x="80" y="292" width="1040" height="338" fill="url(#fade)" />
  </g>
  <rect x="80.5" y="292.5" width="1039" height="420" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.1" />
</svg>
