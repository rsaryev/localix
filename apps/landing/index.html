<!doctype html>
<html lang="en" data-theme="dark" data-site="landing">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- Load the same self-hosted faces used by the kit before CSS discovers them. -->
    <link
      rel="preload"
      href="../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Render-blocking in dev as well as production: no unstyled React frame. -->
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Localix — One workspace for you and a team of agents</title>
    <meta
      name="description"
      content="Localix is an open source Agentic Development Environment: agent teams, a fast Browser, and plugins you build in minutes on embeddings and decision models."
    />
    <link rel="canonical" href="https://localix.ai/" />
    <meta name="theme-color" content="#070707" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Localix" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://localix.ai/" />
    <meta property="og:title" content="Localix — One workspace for you and a team of agents" />
    <meta
      property="og:description"
      content="Localix is an open source Agentic Development Environment: agent teams, a fast Browser, and plugins you build in minutes on embeddings and decision models."
    />
    <meta property="og:image" content="https://localix.ai/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Agentic Development Environment, above the Localix app running a /workflows demo"
    />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Localix — One workspace for you and a team of agents" />
    <meta
      name="twitter:description"
      content="Localix is an open source Agentic Development Environment: agent teams, a fast Browser, and plugins you build in minutes on embeddings and decision models."
    />
    <meta name="twitter:image" content="https://localix.ai/og.png" />
    <meta
      name="twitter:image:alt"
      content="The Agentic Development Environment, above the Localix app running a /workflows demo"
    />
    <!-- The landing stays dark from the first paint, independently of system appearance. -->
    <style>
      html {
        background: #070707;
        color-scheme: dark;
      }
    </style>
    <!-- Sections fade in on scroll only where the observer that un-hides them exists; everywhere
         else (no script, an old browser, reduced motion) the content simply stays visible. -->
    <script>
      if (
        'IntersectionObserver' in window &&
        !matchMedia('(prefers-reduced-motion: reduce)').matches
      ) {
        document.documentElement.classList.add('reveal-ready')
      }
    </script>
    <!-- Semantic structured data; no rating, review, price, or release is implied. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://localix.ai/#website",
            "name": "Localix",
            "url": "https://localix.ai/",
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://localix.ai/#app",
            "name": "Localix",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "macOS",
            "url": "https://localix.ai/",
            "description": "Localix is an open source Agentic Development Environment: agent teams, a fast Browser, and plugins you build in minutes on embeddings and decision models.",
            "image": "https://localix.ai/og.png",
            "screenshot": "https://localix.ai/films/demo.jpg",
            "license": "https://opensource.org/licenses/MIT",
            "isAccessibleForFree": true,
            "sameAs": ["https://github.com/rsaryev/localix"],
            "author": { "@type": "Organization", "name": "Localix", "url": "https://localix.ai/" }
          },
          {
            "@type": "VideoObject",
            "name": "Localix demo: one /workflows run",
            "description": "A /workflows prompt puts three cards on the board, agents build and test a dark 2048 game in the browser, and a Visual Feedback comment adds a light theme.",
            "thumbnailUrl": "https://localix.ai/films/demo.jpg",
            "contentUrl": "https://localix.ai/films/demo.mp4",
            "uploadDate": "2026-10-19",
            "duration": "PT39S",
            "about": { "@id": "https://localix.ai/#app" }
          }
        ]
      }
    </script>
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />
    <meta name="application-name" content="Localix" />
    <meta name="apple-mobile-web-app-title" content="Localix" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
