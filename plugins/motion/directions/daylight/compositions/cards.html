<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #cards-root {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            90% 55% at 50% 52%,
            color-mix(in srgb, var(--mk-surface) 80%, var(--mk-bg)),
            var(--mk-bg) 75%
          );
        }
        #cards-glow {
          left: 50%;
          top: 52%;
          margin: calc(var(--u) * -35) 0 0 calc(var(--u) * -35);
        }
        #cards-stage {
          position: absolute;
          inset: 0;
        }
        .cards-card {
          position: absolute;
          left: calc(50% - var(--u) * 28);
          top: calc(50% - var(--u) * 22);
          width: calc(var(--u) * 56);
          height: calc(var(--u) * 44);
          box-sizing: border-box;
          padding: calc(var(--u) * 2.6);
          gap: calc(var(--u) * 1.8);
          border: none;
          box-shadow:
            0 0 0 1px color-mix(in srgb, var(--mk-text) 6%, transparent),
            0 calc(var(--u) * 2.4) calc(var(--u) * 7)
              color-mix(in srgb, var(--mk-text) 13%, transparent);
        }
        .cards-head {
          display: flex;
          align-items: baseline;
          gap: calc(var(--u) * 1.8);
          padding: 0 calc(var(--u) * 0.6);
        }
        .cards-no {
          font-size: calc(var(--u) * 2.8);
          font-weight: 800;
          letter-spacing: 0.08em;
          color: var(--mk-accent);
          font-variant-numeric: tabular-nums;
        }
        .cards-title {
          font-family: var(--mk-display);
          font-size: calc(var(--u) * 5.2);
          font-weight: var(--mk-display-weight);
          letter-spacing: var(--mk-display-tracking);
          line-height: 1.1;
          color: var(--mk-text);
        }
        .cards-art {
          position: relative;
          flex: 1;
          overflow: hidden;
          border-radius: var(--mk-radius);
          background: color-mix(in srgb, var(--mk-accent) 9%, var(--mk-bg));
        }
        .cards-art svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        .cards-hill {
          fill: color-mix(in srgb, var(--mk-text) 10%, var(--mk-bg));
        }
        .cards-sun {
          fill: var(--mk-accent);
        }
        #cards-c2 .cards-art {
          background-color: var(--mk-bg);
          background-image: radial-gradient(
            color-mix(in srgb, var(--mk-text) 20%, transparent) 1.4px,
            transparent 1.8px
          );
          background-size: calc(var(--u) * 2.6) calc(var(--u) * 2.6);
        }
        .cards-ring {
          fill: none;
          stroke: var(--mk-text);
          stroke-width: 2.4;
          stroke-linecap: round;
        }
        .cards-dot {
          fill: var(--mk-accent);
        }
        .cards-wave {
          fill: none;
          stroke: color-mix(in srgb, var(--mk-text) 32%, transparent);
          stroke-width: 3;
          stroke-linecap: round;
        }
        .cards-wave.is-accent {
          stroke: var(--mk-accent);
          stroke-width: 6;
        }
        #cards-c1 {
          z-index: 1;
        }
        #cards-c2 {
          z-index: 2;
        }
        #cards-c3 {
          z-index: 3;
        }
        #cards-label {
          position: absolute;
          left: 0;
          right: 0;
          top: calc(var(--u) * 41);
          display: flex;
          justify-content: center;
          align-items: center;
          gap: calc(var(--u) * 1.4);
          color: var(--mk-text);
        }
        #cards-label i {
          display: block;
          width: calc(var(--u) * 1.6);
          height: calc(var(--u) * 1.6);
          border-radius: 50%;
          background: var(--mk-accent);
        }
        #cards-caption {
          position: absolute;
          left: var(--mk-safe);
          right: var(--mk-safe);
          top: calc(var(--u) * 131);
          display: flex;
          justify-content: center;
        }
        #cards-root .mk-caption {
          display: inline-block;
          font-family: var(--mk-display);
          font-size: calc(var(--u) * 6);
          letter-spacing: var(--mk-display-tracking);
          line-height: 1.25;
          padding: 0.06em 0.4em 0.12em;
          border-radius: 0.26em;
        }
        #cards-caption-text {
          display: inline-block;
        }
      </style>
      <div
        id="cards-root"
        class="mk-scene"
        data-composition-id="cards"
        data-width="1080"
        data-height="1920"
      >
        <div id="cards-glow" class="mk-glow"></div>
        <div id="cards-label" class="mk-label">
          <i></i><span data-sample>The collection · 3 pieces</span>
        </div>
        <div id="cards-stage" data-layout-allow-overflow>
          <div id="cards-c1" class="mk-card cards-card">
            <div class="cards-head">
              <span class="cards-no">01</span
              ><span class="cards-title" data-sample>A brighter day</span>
            </div>
            <div class="cards-art">
              <svg viewBox="0 0 170 100" preserveAspectRatio="xMidYMid slice">
                <circle id="cards-sun" class="cards-sun" cx="112" cy="60" r="22" />
                <path
                  class="cards-hill"
                  d="M -10 72 C 30 56, 62 84, 104 68 S 160 58, 180 64 L 180 110 L -10 110 Z"
                />
              </svg>
            </div>
          </div>
          <div id="cards-c2" class="mk-card cards-card">
            <div class="cards-head">
              <span class="cards-no">02</span
              ><span class="cards-title" data-sample>A small detail</span>
            </div>
            <div class="cards-art">
              <svg viewBox="0 0 170 100" preserveAspectRatio="xMidYMid slice">
                <circle
                  id="cards-ring"
                  class="cards-ring"
                  cx="85"
                  cy="50"
                  r="24"
                  transform="rotate(-90 85 50)"
                />
                <circle id="cards-dot" class="cards-dot" cx="85" cy="50" r="7" />
              </svg>
            </div>
          </div>
          <div id="cards-c3" class="mk-card cards-card">
            <div class="cards-head">
              <span class="cards-no">03</span
              ><span class="cards-title" data-sample>A new feeling</span>
            </div>
            <div class="cards-art">
              <svg viewBox="0 0 170 100" preserveAspectRatio="xMidYMid slice">
                <path
                  id="cards-wave-1"
                  class="cards-wave"
                  d="M -6 30 C 22 16, 46 44, 85 30 S 146 16, 176 30"
                />
                <path
                  id="cards-wave-2"
                  class="cards-wave is-accent"
                  d="M -6 52 C 22 36, 46 68, 85 52 S 146 36, 176 52"
                />
                <path
                  id="cards-wave-3"
                  class="cards-wave"
                  d="M -6 74 C 22 60, 46 88, 85 74 S 146 60, 176 74"
                />
              </svg>
            </div>
          </div>
        </div>
        <div id="cards-caption">
          <span id="cards-cap" class="mk-caption"
            ><span id="cards-caption-text" data-sample>Made to belong together.</span></span
          >
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const u =
            parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 10.8
          const tl = gsap.timeline({ paused: true })
          // Poses in units of --u from the frame centre: [x, y, rotation°].
          const from = [
            [-110, -46, -16],
            [110, 6, 14],
            [-4, 118, 10],
          ]
          const apart = [
            [-15, -40, -6],
            [15, -1, 5],
            [-10, 39, -3],
          ]
          const stack = [
            [-1, -15, -3],
            [1, -4, 2.5],
            [0, 7, -1],
          ]
          const cards = ['#cards-c1', '#cards-c2', '#cards-c3']
          // Separate thoughts: each card arrives on its own, from its own side.
          cards.forEach((card, i) => {
            tl.fromTo(
              card,
              { x: from[i][0] * u, y: from[i][1] * u, rotation: from[i][2] },
              {
                x: apart[i][0] * u,
                y: apart[i][1] * u,
                rotation: apart[i][2],
                duration: MK.dur(0.85),
                ease: 'power3.out',
              },
              0.15 + i * 0.5,
            )
          })
          // Each card's little picture comes alive as it lands.
          tl.fromTo(
            '#cards-sun',
            { y: 34 },
            { y: 0, duration: MK.dur(1.3), ease: MK.ease.soft },
            0.4,
          )
          tl.fromTo(
            '#cards-dot',
            { scale: 0 },
            { scale: 1, duration: MK.dur(0.5), ease: MK.ease.soft, transformOrigin: '50% 50%' },
            0.85,
          )
          MK.drawPath(tl, '#cards-ring', 0.95, MK.dur(0.7))
          ;['#cards-wave-1', '#cards-wave-2', '#cards-wave-3'].forEach((wave, i) =>
            MK.drawPath(tl, wave, 1.35 + i * 0.1, MK.dur(0.8)),
          )
          // One composition: the cards gather into a stack, with the scene's one gentle overshoot.
          cards.forEach((card, i) => {
            tl.to(
              card,
              {
                x: stack[i][0] * u,
                y: stack[i][1] * u,
                rotation: stack[i][2],
                scale: 1.08,
                duration: MK.dur(0.9),
                ease: 'back.out(1.3)',
              },
              2.15 + i * 0.07,
            )
          })
          tl.fromTo(
            '#cards-glow',
            { scale: 0.6, opacity: 0 },
            { scale: 1, opacity: 1, duration: 1.6, ease: MK.ease.move },
            2.1,
          )
          tl.fromTo(
            '#cards-label',
            { opacity: 0, y: 1.5 * u },
            { opacity: 1, y: 0, duration: MK.dur(0.6), ease: MK.ease.soft },
            2.65,
          )
          tl.fromTo(
            '#cards-cap',
            { clipPath: 'inset(0% 100% 0% 0% round 0.26em)', y: 1.4 * u },
            {
              clipPath: 'inset(0% 0% 0% 0% round 0.26em)',
              y: 0,
              duration: MK.dur(0.62),
              ease: 'power3.out',
            },
            2.75,
          )
          tl.fromTo(
            '#cards-caption-text',
            { x: -3 * u, opacity: 0 },
            { x: 0, opacity: 1, duration: MK.dur(0.7), ease: MK.ease.enter },
            2.83,
          )
          MK.pushIn(tl, '#cards-stage', 0, 4.9, { to: 1.035 })
          window.__timelines['cards'] = tl
        })
      </script>
    </template>
  </body>
</html>
