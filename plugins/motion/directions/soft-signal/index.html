<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Soft signal</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="blocks/motion-kit.css" />
    <link rel="stylesheet" href="blocks/style.css" />
    <script src="blocks/motion-kit.js"></script>
    <style>
      :root {
        /* 1% of the shorter frame edge; every block and scene sizes from it. */
        --u: 10.8px;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #finish {
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      Soft signal: translucent lavender planes float in depth behind one line, fold out of 3D space
      into a glowing fan-shaped mark, and resolve into a quiet lockup. Blur-through between scenes.
      Retiming a scene: change its data-start/data-duration here and the transition times below.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10.4"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="feeling"
        data-composition-id="feeling"
        data-composition-src="compositions/feeling.html"
        data-start="0"
        data-duration="3.6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="fold"
        data-composition-id="fold"
        data-composition-src="compositions/fold.html"
        data-start="3"
        data-duration="4.2"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="signoff"
        data-composition-id="signoff"
        data-composition-src="compositions/signoff.html"
        data-start="6.6"
        data-duration="3.8"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="finish"
        data-composition-id="finish"
        data-composition-src="compositions/finish.html"
        data-start="0"
        data-duration="10.4"
        data-track-index="9"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      // Blur-through for both turns: the planes dissolve into the next layer of depth.
      MK.transition(tl, 'blur', '#feeling', '#fold', 3, { duration: 0.6 })
      MK.transition(tl, 'blur', '#fold', '#signoff', 6.6, { duration: 0.6 })
      window.__timelines['main'] = tl
    </script>
  </body>
</html>
