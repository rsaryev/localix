<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #signoff-root {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            ellipse 70% 65% at 50% 45%,
            var(--mk-surface),
            var(--mk-bg) 75%
          );
        }
        #signoff-stage {
          gap: 0;
        }
        #signoff-glow {
          position: absolute;
          left: 50%;
          top: 50%;
          width: calc(var(--u) * 44);
          height: calc(var(--u) * 44);
          margin: calc(var(--u) * -22) 0 0 calc(var(--u) * -22);
          border-radius: 50%;
          background: radial-gradient(
            closest-side,
            color-mix(in srgb, var(--mk-accent) var(--mk-glow), transparent),
            transparent
          );
        }
        /* The same petal fan as the fold scene, at lockup size. Replace with the real logo. */
        #signoff-mark {
          position: relative;
          width: calc(var(--u) * 26);
          height: calc(var(--u) * 15);
          margin-bottom: calc(var(--u) * 5);
        }
        .signoff-plane {
          position: absolute;
          left: 50%;
          bottom: 0;
          width: calc(var(--u) * 5.6);
          height: calc(var(--u) * 14.2);
          margin-left: calc(var(--u) * -2.8);
          border-radius: calc(var(--u) * 2.8);
          transform-origin: 50% 100%;
          background: linear-gradient(
            165deg,
            color-mix(in srgb, var(--mk-accent) 58%, transparent),
            color-mix(in srgb, var(--mk-accent) 12%, transparent) 78%
          );
          border: 1px solid color-mix(in srgb, var(--mk-text) 30%, transparent);
          box-shadow: inset 0 1px 0 color-mix(in srgb, var(--mk-text) 40%, transparent);
        }
        #signoff-name {
          margin: 0;
          font-family: var(--mk-sans);
          font-size: calc(var(--u) * 9.5);
          font-weight: 300;
          letter-spacing: -0.02em;
          line-height: 1.05;
          color: var(--mk-text);
        }
        #signoff-tagline {
          margin-top: calc(var(--u) * 2.6);
          font-weight: 400;
          letter-spacing: 0.32em;
          color: var(--mk-muted);
          padding-left: 0.32em;
        }
      </style>
      <div
        id="signoff-root"
        class="mk-scene"
        data-composition-id="signoff"
        data-width="1920"
        data-height="1080"
      >
        <div id="signoff-stage" class="mk-center">
          <div id="signoff-mark">
            <div id="signoff-glow" data-layout-allow-overflow></div>
            <div class="signoff-plane"></div>
            <div class="signoff-plane"></div>
            <div class="signoff-plane"></div>
            <div class="signoff-plane"></div>
          </div>
          <h2 id="signoff-name" data-sample>Soft signal.</h2>
          <div id="signoff-tagline" class="mk-label" data-sample>
            Small gestures. Lasting impressions.
          </div>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const fan = [-42, -14, 14, 42]
          // The fan opens a last few degrees as the scene arrives, then rests.
          tl.fromTo(
            '.signoff-plane',
            { rotation: (i) => fan[i] * 0.6 },
            { rotation: (i) => fan[i], duration: 1.4, ease: MK.ease.enter },
            0.1,
          )
          tl.fromTo(
            '#signoff-glow',
            { opacity: 0.4, scale: 0.8 },
            { opacity: 1, scale: 1, duration: 2.4, ease: MK.ease.move },
            0,
          )
          MK.revealWords(tl, '#signoff-name', 0.45, { duration: 1.1, stagger: 0.14 })
          tl.fromTo(
            '#signoff-tagline',
            { opacity: 0, y: '0.6em' },
            { opacity: 1, y: 0, duration: 1.1, ease: MK.ease.enter },
            0.9,
          )
          MK.pushIn(tl, '#signoff-stage', 0, 3.8, { to: 1.025 })
          window.__timelines['signoff'] = tl
        })
      </script>
    </template>
  </body>
</html>
