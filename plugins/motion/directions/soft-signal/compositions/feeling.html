<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #feeling-root {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            ellipse 75% 70% at 50% 60%,
            var(--mk-surface),
            var(--mk-bg) 75%
          );
        }
        /* Depth: translucent planes float at different distances behind the line. */
        #feeling-space {
          position: absolute;
          inset: 0;
          perspective: calc(var(--u) * 150);
          transform-style: preserve-3d;
        }
        .feeling-plane {
          position: absolute;
          left: 50%;
          top: 50%;
          width: calc(var(--u) * var(--w));
          height: calc(var(--u) * var(--h));
          margin: calc(var(--u) * var(--h) / -2) 0 0 calc(var(--u) * var(--w) / -2);
          border-radius: calc(var(--u) * var(--w) / 2);
          filter: blur(calc(var(--b) * 1px));
          background: linear-gradient(
            165deg,
            color-mix(in srgb, var(--mk-accent) 40%, transparent),
            color-mix(in srgb, var(--mk-accent) 6%, transparent) 72%
          );
          border: 1px solid color-mix(in srgb, var(--mk-text) 24%, transparent);
          box-shadow:
            inset 0 1px 0 color-mix(in srgb, var(--mk-text) 32%, transparent),
            0 calc(var(--u) * 3) calc(var(--u) * 8) rgba(0, 0, 0, 0.28);
          overflow: hidden;
        }
        #feeling-type {
          position: absolute;
          inset: var(--mk-safe);
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        #feeling-title {
          margin: 0;
          font-family: var(--mk-sans);
          font-size: calc(var(--u) * 7.2);
          font-weight: 300;
          letter-spacing: 0.3em;
          line-height: 1.1;
          text-transform: uppercase;
          color: var(--mk-text);
          padding-left: 0.3em;
          text-shadow: 0 0 calc(var(--u) * 4) color-mix(in srgb, var(--mk-bg) 80%, transparent);
        }
      </style>
      <div
        id="feeling-root"
        class="mk-scene"
        data-composition-id="feeling"
        data-width="1920"
        data-height="1080"
      >
        <div id="feeling-space" data-layout-allow-overflow>
          <div class="feeling-plane" style="--w: 11; --h: 28; --b: 4"></div>
          <div class="feeling-plane" style="--w: 11; --h: 28; --b: 4"></div>
          <div class="feeling-plane" style="--w: 11; --h: 28; --b: 0"></div>
          <div class="feeling-plane" style="--w: 11; --h: 28; --b: 0"></div>
          <div class="feeling-plane" style="--w: 11; --h: 28; --b: 0"></div>
          <div class="feeling-plane" style="--w: 16; --h: 40; --b: 9"></div>
          <div class="feeling-plane" style="--w: 16; --h: 40; --b: 11"></div>
        </div>
        <div id="feeling-type">
          <h1 id="feeling-title" data-sample>Shape a new feeling.</h1>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const u = parseFloat(MK.knob('--u', '10.8'))
          // Rest poses (x, y in --u; z in px; degrees), back to front.
          // Far petals are small and soft, mid petals sharp, near petals large and out of focus.
          const poses = [
            { x: -8, y: -30, z: -1100, rx: 10, ry: 20, dx: 3, dr: 6 },
            { x: 20, y: 30, z: -1000, rx: -10, ry: -20, dx: -3, dr: -6 },
            { x: -40, y: 10, z: -360, rx: 14, ry: 42, dx: 4, dr: 5 },
            { x: 42, y: -14, z: -320, rx: -12, ry: -42, dx: -4, dr: -5 },
            { x: -24, y: 30, z: -560, rx: 30, ry: 10, dx: -3, dr: 6 },
            { x: -70, y: -28, z: 120, rx: 8, ry: 30, dx: 5, dr: 4 },
            { x: 72, y: 30, z: 180, rx: -8, ry: -30, dx: -5, dr: -4 },
          ]
          const planes = [...document.querySelectorAll('.feeling-plane')]
          planes.forEach((plane, i) => {
            const p = poses[i]
            // Each petal points away from the centre: the mark, exploded into depth.
            const rz = (Math.atan2(p.x, -p.y) * 180) / Math.PI
            gsap.set(plane, { x: p.x * u, y: p.y * u, rotation: rz })
            // Arrive out of the deep, turning toward the light.
            tl.fromTo(
              plane,
              { z: p.z - 700, rotationX: p.rx, rotationY: p.ry + 30, opacity: 0 },
              {
                z: p.z,
                rotationX: p.rx,
                rotationY: p.ry,
                opacity: 1,
                duration: 2.2,
                ease: MK.ease.enter,
              },
              0.1 * i,
            )
            // Then drift, never quite still.
            tl.to(
              plane,
              { x: (p.x + p.dx) * u, rotation: rz + p.dr, duration: 3.6, ease: 'none' },
              0,
            )
          })
          // The line resolves out of a blur while its letters close in from a wider spacing.
          const chars = [...MK.split('#feeling-title', 'chars').querySelectorAll('.mk-char')]
          const mid = (chars.length - 1) / 2
          tl.fromTo(
            '#feeling-title',
            { filter: 'blur(14px)', opacity: 0 },
            { filter: 'blur(0px)', opacity: 1, duration: 1.6, ease: MK.ease.enter },
            0.5,
          )
          tl.fromTo(
            chars,
            { x: (i) => (i - mid) * u * 1.1 },
            { x: 0, duration: 1.9, ease: MK.ease.enter },
            0.5,
          )
          window.__timelines['feeling'] = tl
        })
      </script>
    </template>
  </body>
</html>
