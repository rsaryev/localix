<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #fold-root {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            ellipse 70% 65% at 50% 55%,
            var(--mk-surface),
            var(--mk-bg) 75%
          );
        }
        #fold-glow {
          position: absolute;
          left: 50%;
          top: 47%;
          width: calc(var(--u) * 84);
          height: calc(var(--u) * 84);
          margin: calc(var(--u) * -42) 0 0 calc(var(--u) * -42);
          border-radius: 50%;
          background: radial-gradient(
            closest-side,
            color-mix(in srgb, var(--mk-accent) var(--mk-glow), transparent),
            color-mix(in srgb, var(--mk-accent) 10%, transparent) 50%,
            transparent
          );
        }
        #fold-space {
          position: absolute;
          inset: 0;
          perspective: calc(var(--u) * 140);
          transform-style: preserve-3d;
        }
        /* The mark: four petals fanned from one pivot point (bottom centre) at 64% height. */
        .fold-plane {
          position: absolute;
          left: 50%;
          top: 64%;
          width: calc(var(--u) * 11);
          height: calc(var(--u) * 28);
          margin: calc(var(--u) * -28) 0 0 calc(var(--u) * -5.5);
          border-radius: calc(var(--u) * 5.5);
          transform-origin: 50% 100%;
          background: linear-gradient(
            165deg,
            color-mix(in srgb, var(--mk-accent) 58%, transparent),
            color-mix(in srgb, var(--mk-accent) 12%, transparent) 78%
          );
          border: 1px solid color-mix(in srgb, var(--mk-text) 30%, transparent);
          box-shadow: inset 0 1px 0 color-mix(in srgb, var(--mk-text) 40%, transparent);
          overflow: hidden;
        }
        /* A band of light that crosses each plane as it folds flat. */
        .fold-sheen {
          position: absolute;
          top: -20%;
          bottom: -20%;
          left: -50%;
          width: 200%;
          background: linear-gradient(
            100deg,
            transparent 38%,
            color-mix(in srgb, var(--mk-text) 38%, transparent) 50%,
            transparent 62%
          );
        }
        #fold-leak {
          position: absolute;
          inset: -20%;
          background:
            radial-gradient(
              30% 40% at 34% 40%,
              color-mix(in srgb, var(--mk-accent) 60%, transparent),
              transparent 70%
            ),
            radial-gradient(
              26% 34% at 68% 60%,
              color-mix(
                in srgb,
                color-mix(in srgb, var(--mk-accent) 55%, var(--mk-text)) 34%,
                transparent
              ),
              transparent 70%
            );
          mix-blend-mode: screen;
        }
      </style>
      <div
        id="fold-root"
        class="mk-scene"
        data-composition-id="fold"
        data-width="1920"
        data-height="1080"
      >
        <div id="fold-glow"></div>
        <div id="fold-space" data-layout-allow-overflow>
          <div class="fold-plane"><i class="fold-sheen"></i></div>
          <div class="fold-plane"><i class="fold-sheen"></i></div>
          <div class="fold-plane"><i class="fold-sheen"></i></div>
          <div class="fold-plane"><i class="fold-sheen"></i></div>
        </div>
        <div id="fold-leak" data-layout-allow-overflow></div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const u = parseFloat(MK.knob('--u', '10.8'))
          // Where each plane starts (open in space, close to camera) and its angle in the fan.
          const starts = [
            { x: -54, y: -12, z: 120, rx: 20, ry: 52, rz: -58, fan: -42 },
            { x: -18, y: 24, z: 40, rx: -24, ry: -48, rz: 30, fan: -14 },
            { x: 24, y: -24, z: 80, rx: 26, ry: 50, rz: -22, fan: 14 },
            { x: 58, y: 16, z: 160, rx: -10, ry: -56, rz: 64, fan: 42 },
          ]
          const planes = [...document.querySelectorAll('.fold-plane')]
          planes.forEach((plane, i) => {
            const s = starts[i]
            // The fold: each petal swings flat, slides into its place in the fan and racks into focus.
            tl.fromTo(
              plane,
              {
                x: s.x * u,
                y: s.y * u,
                z: s.z,
                rotationX: s.rx,
                rotationY: s.ry,
                rotation: s.rz,
                opacity: 0.6,
                filter: 'blur(8px)',
              },
              {
                x: 0,
                y: 0,
                z: 0,
                rotationX: 0,
                rotationY: 0,
                rotation: s.fan,
                opacity: 1,
                filter: 'blur(0px)',
                duration: 2.1,
                ease: 'power2.inOut',
              },
              0.12 * i,
            )
          })
          tl.fromTo(
            '.fold-sheen',
            { xPercent: -60 },
            { xPercent: 60, duration: 1.2, ease: MK.ease.move, stagger: 0.1 },
            1.2,
          )
          // The mark glows only once it has formed; one light leak passes at the climax.
          tl.fromTo(
            '#fold-glow',
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 1.8, ease: MK.ease.move },
            1.7,
          )
          tl.fromTo(
            '#fold-leak',
            { opacity: 0, xPercent: -8 },
            { opacity: 0.7, xPercent: 0, duration: 0.5, ease: 'power2.out' },
            2.3,
          )
          tl.to('#fold-leak', { opacity: 0, xPercent: 6, duration: 1.0, ease: 'power2.in' }, 2.8)
          MK.pushIn(tl, '#fold-space', 0, 4.2, { from: 1.04, to: 1 })
          window.__timelines['fold'] = tl
        })
      </script>
    </template>
  </body>
</html>
