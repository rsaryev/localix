<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #lines-root {
          position: absolute;
          inset: 0;
        }
        /* Poster grammar shared by every scene: fitted lines, outlines, cream highlights. */
        .ob-type {
          width: fit-content;
          white-space: nowrap;
          font-family: var(--mk-display);
          font-weight: var(--mk-display-weight);
          text-transform: var(--mk-display-case);
          letter-spacing: var(--mk-display-tracking);
          font-size: calc(var(--u) * 10);
          line-height: 0.84;
        }
        /* Outline type: the stroke paints under a ground-coloured fill, so overlapping contours
           inside the glyphs stay hidden and only the outer half of the stroke shows. */
        .ob-outline {
          color: var(--mk-text);
          -webkit-text-fill-color: var(--mk-bg);
          -webkit-text-stroke: calc(var(--u) * 0.7) var(--mk-text);
          paint-order: stroke fill;
        }
        .ob-labels {
          display: flex;
          justify-content: space-between;
          flex: none;
          overflow: hidden;
          font-size: var(--mk-label);
          font-weight: 800;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          line-height: 1.2;
        }
        .ob-labels > * {
          display: inline-block;
        }
        #lines-cam {
          position: absolute;
          inset: 0;
        }
        #lines-frame {
          position: absolute;
          inset: var(--mk-safe);
          display: flex;
          flex-direction: column;
        }
        #lines-stack {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: calc(var(--u) * 1.4);
        }
        .lines-row {
          display: flex;
        }
        .lines-row.is-right {
          justify-content: flex-end;
        }
        /* The name's second half sits on a cream highlight. */
        #lines-slab {
          width: 100%;
          overflow: hidden;
          background: var(--mk-accent);
        }
        #lines-slab .ob-type {
          padding: 0.07em 0 0.05em;
        }
      </style>
      <div
        id="lines-root"
        class="mk-scene"
        data-composition-id="lines"
        data-width="1080"
        data-height="1920"
      >
        <div id="lines-cam">
          <div id="lines-frame">
            <div id="lines-top" class="ob-labels">
              <span data-sample>Offbeat Festival</span>
              <span data-sample>No. 07</span>
            </div>
            <div id="lines-stack">
              <div class="lines-row">
                <div class="ob-type ob-outline lines-thin" data-sample>Sound</div>
              </div>
              <div class="lines-row is-right">
                <div class="ob-type ob-outline lines-thin" data-sample>Light</div>
              </div>
              <div class="lines-row">
                <div class="ob-type ob-outline lines-thin" data-sample>Motion</div>
              </div>
              <div class="lines-row is-right">
                <div id="lines-off" class="ob-type" data-sample>Off</div>
              </div>
              <div class="lines-row">
                <div id="lines-slab">
                  <div id="lines-beat" class="ob-type" data-sample>beat</div>
                </div>
              </div>
            </div>
            <div id="lines-foot" class="ob-labels" data-layout-allow-overflow>
              <span data-sample>Three nights</span>
              <span data-sample>Lisbon · June</span>
            </div>
          </div>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const BEAT = 0.35
          // Fit a nowrap line to a width. Three passes: system fonts change width with optical size.
          const fit = (el, width) => {
            for (let pass = 0; pass < 3; pass++) {
              const size = parseFloat(getComputedStyle(el).fontSize)
              el.style.fontSize = `${(size * width) / el.offsetWidth}px`
            }
          }
          const root = document.querySelector('#lines-root')
          const slab = document.querySelector('#lines-slab')
          const W = MK.withLayout(root, () => {
            // Outline lines run 78% of the width, alternating sides; the name runs edge to edge.
            const width = document.querySelector('#lines-stack').offsetWidth
            const pad = width * 0.035
            slab.style.padding = `0 ${pad}px`
            document
              .querySelectorAll('#lines-root .lines-thin')
              .forEach((el) => fit(el, width * 0.78))
            fit(document.querySelector('#lines-off'), width)
            fit(document.querySelector('#lines-beat'), width - pad * 2)
            return root.offsetWidth
          })
          const rows = [...document.querySelectorAll('#lines-stack .lines-row')]
          const u = W / 100
          // One line per beat, alternating sides: left, right, left, right, then the highlight.
          rows.forEach((row, i) => {
            const side = i % 2 ? 1 : -1
            const line = row.firstElementChild
            tl.fromTo(
              line,
              { x: side * W, skewX: side * -14 },
              { x: 0, skewX: 0, duration: 0.45, ease: MK.ease.enter },
              i * BEAT,
            )
          })
          tl.fromTo(
            slab,
            { clipPath: 'inset(0 100% 0 0)' },
            { clipPath: 'inset(0 0% 0 0)', duration: 0.3, ease: 'power4.out' },
            4 * BEAT - 0.05,
          )
          // Beat 5: the whole poster kicks (the scene's one overshoot), then keeps a slow sway.
          tl.fromTo(
            '#lines-stack',
            { scale: 1.05 },
            { scale: 1, duration: 0.5, ease: MK.ease.pop, immediateRender: false },
            5 * BEAT,
          )
          tl.fromTo(
            '#lines-foot > *',
            { yPercent: 110 },
            { yPercent: 0, duration: 0.35, ease: MK.ease.enter, stagger: 0.06 },
            4 * BEAT,
          )
          rows.slice(0, 3).forEach((row, i) => {
            tl.fromTo(
              row,
              { x: 0 },
              { x: (i % 2 ? -1 : 1) * 1.6 * u, duration: 3.4 - 6 * BEAT, ease: 'none' },
              6 * BEAT,
            )
          })
          // The camera whip: a hard push toward the name as the date rises in (index.html).
          tl.fromTo(
            '#lines-cam',
            { scale: 1 },
            { scale: 1.35, transformOrigin: '50% 72%', duration: 0.45, ease: 'power4.in' },
            2.95,
          )
          window.__timelines['lines'] = tl
        })
      </script>
    </template>
  </body>
</html>
