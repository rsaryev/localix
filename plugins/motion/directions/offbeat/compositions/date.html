<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #date-root {
          position: absolute;
          inset: 0;
        }
        /* Poster grammar shared by every scene: fitted lines, outlines, cream highlights. */
        .ob-type {
          width: fit-content;
          white-space: nowrap;
          font-family: var(--mk-display);
          font-weight: var(--mk-display-weight);
          text-transform: var(--mk-display-case);
          letter-spacing: var(--mk-display-tracking);
          font-size: calc(var(--u) * 10);
          line-height: 0.84;
        }
        /* Outline type: the stroke paints under a ground-coloured fill, so overlapping contours
           inside the glyphs stay hidden and only the outer half of the stroke shows. */
        .ob-outline {
          color: var(--mk-text);
          -webkit-text-fill-color: var(--mk-bg);
          -webkit-text-stroke: calc(var(--u) * 0.7) var(--mk-text);
          paint-order: stroke fill;
        }
        .ob-labels {
          display: flex;
          justify-content: space-between;
          flex: none;
          overflow: hidden;
          font-size: var(--mk-label);
          font-weight: 800;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          line-height: 1.2;
        }
        .ob-labels > * {
          display: inline-block;
        }
        #date-cam {
          position: absolute;
          inset: 0;
        }
        #date-spin {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          aspect-ratio: 1;
        }
        #date-star {
          display: block;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        #date-star polygon {
          fill: var(--mk-accent);
        }
        #date-frame {
          position: absolute;
          inset: var(--mk-safe);
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
        #date-block {
          display: flex;
          flex-direction: column;
          gap: calc(var(--u) * 1);
        }
        .date-row {
          display: flex;
        }
        .date-row.is-right {
          justify-content: flex-end;
        }
        #date-place {
          display: flex;
          flex-direction: column;
          gap: calc(var(--u) * 2);
        }
        /* The place on a black bar, set in cream. */
        #date-slab {
          overflow: hidden;
          background: var(--mk-text);
          color: var(--mk-accent);
        }
        #date-city {
          padding: 0.08em 0 0.06em;
        }
      </style>
      <div
        id="date-root"
        class="mk-scene"
        data-composition-id="date"
        data-width="1080"
        data-height="1920"
      >
        <div id="date-cam">
          <div id="date-spin" aria-hidden="true">
            <svg id="date-star" viewBox="-100 -100 200 200"><polygon id="date-star-shape" /></svg>
          </div>
          <div id="date-frame">
            <div id="date-top" class="ob-labels">
              <span data-sample>Save the date</span>
              <span data-sample>No. 07</span>
            </div>
            <div id="date-block">
              <div class="date-row">
                <div id="date-days" class="ob-type" data-sample>12–14</div>
              </div>
              <div class="date-row is-right">
                <div id="date-month" class="ob-type" data-sample>June</div>
              </div>
            </div>
            <div id="date-place">
              <div id="date-slab"><div id="date-city" class="ob-type" data-sample>Lisbon</div></div>
              <div id="date-sub" class="ob-labels">
                <span data-sample>Portugal</span>
                <span data-sample>Music · Art · Talks</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const BEAT = 0.35
          // Fit a nowrap line to a width. Three passes: system fonts change width with optical size.
          const fit = (el, width) => {
            for (let pass = 0; pass < 3; pass++) {
              const size = parseFloat(getComputedStyle(el).fontSize)
              el.style.fontSize = `${(size * width) / el.offsetWidth}px`
            }
          }
          // A 24-point starburst, drawn once.
          const star = (polygon, points = 24, inner = 0.8) => {
            const coords = []
            for (let i = 0; i < points * 2; i++) {
              const r = i % 2 ? 100 * inner : 100
              const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2
              coords.push(`${(Math.cos(a) * r).toFixed(2)},${(Math.sin(a) * r).toFixed(2)}`)
            }
            polygon.setAttribute('points', coords.join(' '))
          }
          const root = document.querySelector('#date-root')
          const slab = document.querySelector('#date-slab')
          const spin = document.querySelector('#date-spin')
          star(document.querySelector('#date-star-shape'))
          const W = MK.withLayout(root, () => {
            const width = document.querySelector('#date-block').offsetWidth
            const pad = width * 0.035
            slab.style.padding = `0 ${pad}px`
            fit(document.querySelector('#date-days'), width)
            fit(document.querySelector('#date-month'), width * 0.8)
            fit(document.querySelector('#date-city'), width - pad * 2)
            // The starburst sits behind the date block, centred on it and wider than the frame.
            const block = MK.offsetWithin('#date-block', root)
            const size = root.offsetWidth * 1.08
            spin.style.width = `${size}px`
            spin.style.left = `${block.x + block.width / 2 - size / 2}px`
            spin.style.top = `${block.y + block.height / 2 - size / 2}px`
            return root.offsetWidth
          })
          // The date rises in with the camera (index.html); its lines land on the beat, alternating.
          tl.fromTo(
            '#date-days',
            { x: -W, skewX: 14 },
            { x: 0, skewX: 0, duration: 0.45, ease: MK.ease.enter },
            BEAT,
          )
          tl.fromTo(
            '#date-month',
            { x: W, skewX: -14 },
            { x: 0, skewX: 0, duration: 0.45, ease: MK.ease.enter },
            2 * BEAT,
          )
          // The starburst bursts open behind the month (the one overshoot), then turns slowly.
          tl.fromTo(
            '#date-star',
            { scale: 0, rotation: -50 },
            { scale: 1, rotation: 0, transformOrigin: '50% 50%', duration: 0.6, ease: MK.ease.pop },
            2 * BEAT,
          )
          tl.fromTo(
            spin,
            { rotation: 0 },
            { rotation: 24, duration: 3.5 - 2 * BEAT, ease: 'none' },
            2 * BEAT,
          )
          // The place bar wipes in from the right; the city rises inside it.
          tl.fromTo(
            slab,
            { clipPath: 'inset(0 0 0 100%)' },
            { clipPath: 'inset(0 0 0 0%)', duration: 0.3, ease: 'power4.out' },
            3 * BEAT,
          )
          tl.fromTo(
            '#date-city',
            { yPercent: 105 },
            { yPercent: 0, duration: 0.45, ease: MK.ease.enter },
            3 * BEAT + 0.08,
          )
          tl.fromTo(
            '#date-sub > *',
            { yPercent: 110 },
            { yPercent: 0, duration: 0.35, ease: MK.ease.enter, stagger: 0.06 },
            4 * BEAT,
          )
          // A slow push keeps the poster alive through the hold.
          MK.pushIn(tl, '#date-cam', 0, 3.5, { to: 1.035 })
          window.__timelines['date'] = tl
        })
      </script>
    </template>
  </body>
</html>
