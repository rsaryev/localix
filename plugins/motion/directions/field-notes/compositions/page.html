<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #page-root {
          position: absolute;
          inset: 0;
          background: color-mix(in srgb, var(--mk-bg) 88%, var(--mk-muted));
          color: var(--mk-text);
        }
        /* The camera: everything on the desk scales about the figure slot. */
        #page-stage {
          position: absolute;
          inset: 0;
        }
        /* A printed spread: running head, masthead, three columns, a figure and a folio. */
        #page-sheet {
          position: absolute;
          inset: calc(var(--u) * 12) calc(var(--u) * 14);
          box-sizing: border-box;
          padding: calc(var(--u) * 4.4) calc(var(--u) * 6);
          background: var(--mk-bg);
          box-shadow:
            0 0 0 1px var(--mk-line),
            0 calc(var(--u) * 1.2) calc(var(--u) * 5) rgba(0, 0, 0, 0.12);
          display: grid;
          grid-template-columns: 1fr 1fr calc(var(--u) * 34);
          grid-template-rows: auto auto 1fr auto;
          column-gap: calc(var(--u) * 5);
          row-gap: calc(var(--u) * 2.6);
        }
        .page-caps {
          font-family: var(--mk-sans);
          font-size: var(--mk-label);
          font-weight: 600;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: var(--mk-muted);
        }
        #page-head {
          grid-column: 1 / -1;
          display: flex;
          justify-content: space-between;
          padding-bottom: calc(var(--u) * 1.4);
          border-bottom: 1px solid var(--mk-text);
        }
        #page-head-name {
          color: var(--mk-accent);
        }
        #page-masthead {
          grid-column: 1 / 3;
          display: flex;
          align-items: baseline;
          gap: calc(var(--u) * 3);
        }
        #page-title {
          margin: 0;
          font-family: var(--mk-display);
          font-weight: var(--mk-display-weight);
          font-size: calc(var(--u) * 9);
          line-height: 1;
          letter-spacing: -0.02em;
        }
        #page-dek {
          font-family: var(--mk-display);
          font-style: italic;
          font-size: calc(var(--u) * 3);
          color: var(--mk-muted);
        }
        .page-col {
          display: flex;
          flex-direction: column;
          gap: calc(var(--u) * 1.6);
        }
        .page-col p {
          margin: 0;
          font-family: var(--mk-display);
          font-size: calc(var(--u) * 3);
          line-height: 1.42;
          hyphens: auto;
        }
        #page-drop::first-letter {
          float: left;
          font-size: 3.2em;
          line-height: 0.82;
          padding: 0.06em 0.1em 0 0;
          color: var(--mk-accent);
        }
        #page-quote {
          margin-top: calc(var(--u) * 0.6);
          padding-top: calc(var(--u) * 1.4);
          border-top: 2px solid var(--mk-accent);
          font-family: var(--mk-display);
          font-style: italic;
          font-size: calc(var(--u) * 3.6);
          line-height: 1.2;
          color: var(--mk-accent);
        }
        #page-figure {
          grid-column: 3;
          grid-row: 2 / 4;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: calc(var(--u) * 1.6);
        }
        /* The slot the document docks into, same proportions as the card. */
        #page-slot {
          width: calc(var(--u) * 34);
          aspect-ratio: 26 / 34;
          border-radius: var(--mk-radius);
        }
        #page-caption {
          width: calc(var(--u) * 34);
          text-align: left;
          font-family: var(--mk-display);
          font-style: italic;
          font-size: calc(var(--u) * 2.6);
          color: var(--mk-muted);
        }
        #page-foot {
          grid-column: 1 / -1;
          display: flex;
          justify-content: space-between;
          padding-top: calc(var(--u) * 1.2);
          border-top: 1px solid color-mix(in srgb, var(--mk-text) 35%, transparent);
        }
        /* The document, the same sheet as in the handoff scene (already stamped). */
        #page-card {
          position: absolute;
          left: 0;
          top: 0;
          width: calc(var(--u) * 26);
          height: calc(var(--u) * 34);
          box-sizing: border-box;
          padding: calc(var(--u) * 2.4);
          border-radius: var(--mk-radius);
          background: var(--mk-surface);
          box-shadow: 0 0 0 1px var(--mk-line);
          display: flex;
          flex-direction: column;
          gap: calc(var(--u) * 1.2);
          transform-origin: 0 0;
        }
        #page-card-lift {
          position: absolute;
          inset: 0;
          border-radius: inherit;
          box-shadow: 0 calc(var(--u) * 1.6) calc(var(--u) * 4) rgba(0, 0, 0, 0.14);
        }
        .page-card-head {
          display: flex;
          justify-content: space-between;
          font-family: var(--mk-sans);
          font-size: calc(var(--u) * 1.5);
          font-weight: 600;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: var(--mk-muted);
        }
        .page-card-title {
          font-family: var(--mk-display);
          font-size: calc(var(--u) * 3);
          line-height: 1.05;
          margin-bottom: calc(var(--u) * 0.6);
        }
        .page-card-line {
          display: block;
          height: calc(var(--u) * 0.7);
          border-radius: 2px;
          background: color-mix(in srgb, var(--mk-text) 14%, transparent);
        }
        #page-stamp {
          position: absolute;
          right: calc(var(--u) * 2);
          bottom: calc(var(--u) * 2.2);
          width: calc(var(--u) * 10);
          height: calc(var(--u) * 10);
          box-sizing: border-box;
          border-radius: 50%;
          border: 3px solid var(--mk-accent);
          display: grid;
          place-items: center;
          color: var(--mk-accent);
          font-family: var(--mk-sans);
          font-size: calc(var(--u) * 1.8);
          font-weight: 700;
          letter-spacing: 0.2em;
          padding-left: 0.2em;
          text-transform: uppercase;
          opacity: 0.92;
          rotate: -12deg;
          box-shadow:
            inset 0 0 0 calc(var(--u) * 0.5) var(--mk-surface),
            inset 0 0 0 calc(var(--u) * 0.5 + 1px) var(--mk-accent);
        }
      </style>
      <div
        id="page-root"
        class="mk-scene"
        data-composition-id="page"
        data-width="1920"
        data-height="1080"
      >
        <div id="page-stage" data-layout-allow-overflow>
          <div id="page-sheet">
            <div id="page-head">
              <span id="page-head-name" class="page-caps" data-sample>Field notes</span>
              <span id="page-head-issue" class="page-caps" data-sample>No. 12 — Autumn</span>
            </div>
            <div id="page-masthead">
              <h2 id="page-title" data-sample>Field notes</h2>
              <span id="page-dek" data-sample>on working slowly, on purpose</span>
            </div>
            <div class="page-col">
              <p id="page-drop" data-sample>
                We slowed the work down on purpose. Every brief now starts as a page: what we saw,
                what we heard, and what we still don't know.
              </p>
              <p data-sample>
                Notes are kept by hand and passed on the same day. The pace is slower; the work
                arrives finished.
              </p>
            </div>
            <div class="page-col">
              <span class="page-caps" data-sample>On pace</span>
              <p data-sample>
                Fewer meetings, longer mornings. Drafts move from desk to desk with a note attached,
                so nothing arrives without context.
              </p>
              <div id="page-quote" data-sample>“Write it down first.”</div>
            </div>
            <div id="page-figure">
              <div id="page-slot"></div>
              <div id="page-caption" data-sample>Fig. 3 — Filed the same day.</div>
            </div>
            <div id="page-foot">
              <span class="page-caps" data-sample>12</span>
              <span class="page-caps" data-sample>A different kind of pace</span>
            </div>
          </div>
          <div id="page-card" data-layout-allow-overlap>
            <div id="page-card-lift"></div>
            <div class="page-card-head" data-layout-allow-overlap>
              <span data-sample data-layout-allow-overlap>Sheet 03</span
              ><span data-sample data-layout-allow-overlap>Oct</span>
            </div>
            <div class="page-card-title" data-sample data-layout-allow-overlap>
              On slower mornings
            </div>
            <i class="page-card-line" style="width: 100%"></i>
            <i class="page-card-line" style="width: 92%"></i>
            <i class="page-card-line" style="width: 97%"></i>
            <i class="page-card-line" style="width: 64%"></i>
            <i class="page-card-line" style="width: 88%"></i>
            <i class="page-card-line" style="width: 40%"></i>
            <div id="page-stamp" data-sample data-layout-allow-overlap>Filed</div>
          </div>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const stage = document.querySelector('#page-stage')
          const u = parseFloat(MK.knob('--u', '10.8'))
          const zoom = 1.45
          // Build-time layout: the figure slot (the camera's pivot) and the frame size.
          const { slot, w, h } = MK.withLayout(stage, () => ({
            slot: MK.offsetWithin('#page-slot', stage),
            w: stage.offsetWidth,
            h: stage.offsetHeight,
          }))
          const pivot = { x: slot.x + slot.width / 2, y: slot.y + slot.height / 2 }
          gsap.set(stage, { transformOrigin: `${pivot.x}px ${pivot.y}px` })
          // CARD: the pose the handoff scene ends on (centred over the last station, its bottom 8u
          // above the route at 76% height), converted into the zoomed stage's coordinates.
          const screen = { x: w * 0.78 - 13 * u, y: h * 0.76 - 8 * u - 34 * u }
          const start = {
            x: pivot.x + (screen.x - pivot.x) / zoom,
            y: pivot.y + (screen.y - pivot.y) / zoom,
            scale: 1 / zoom,
          }
          const dock = { x: slot.x, y: slot.y, scale: slot.width / (26 * u) }

          // The document docks into the figure slot and settles onto the paper.
          tl.fromTo(
            '#page-card',
            { x: start.x, y: start.y, scale: start.scale },
            { x: dock.x, y: dock.y, scale: dock.scale, duration: 1.1, ease: MK.ease.move },
            0.5,
          )
          tl.fromTo(
            '#page-card-lift',
            { opacity: 1 },
            { opacity: 0.15, duration: 0.6, ease: 'power2.out' },
            1.3,
          )
          // The page sets itself around it, block by block.
          tl.fromTo(
            '#page-head, #page-foot',
            { opacity: 0 },
            { opacity: 1, duration: 0.8, ease: 'power1.out' },
            0.7,
          )
          MK.revealLines(tl, '#page-title', 0.9, { duration: 1 })
          tl.fromTo(
            '#page-dek',
            { opacity: 0 },
            { opacity: 1, duration: 0.8, ease: 'power1.out' },
            1.3,
          )
          tl.fromTo(
            '.page-col > *',
            { opacity: 0, y: u * 1.2 },
            { opacity: 1, y: 0, duration: 0.8, ease: MK.ease.enter, stagger: 0.12 },
            1.1,
          )
          tl.fromTo(
            '#page-caption',
            { opacity: 0 },
            { opacity: 1, duration: 0.6, ease: 'power1.out' },
            1.6,
          )
          // The measured pullback: the camera eases out to the whole spread, then holds still.
          tl.fromTo(stage, { scale: zoom }, { scale: 1, duration: 1.8, ease: MK.ease.move }, 1.0)
          window.__timelines['page'] = tl
        })
      </script>
    </template>
  </body>
</html>
