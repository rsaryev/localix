<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #pace-root {
          position: absolute;
          inset: 0;
          background: var(--mk-bg);
          color: var(--mk-text);
        }
        /* An editorial opening page: running head, a margin column, the headline on a strong axis. */
        #pace-page {
          position: absolute;
          inset: calc(var(--u) * 7) calc(var(--u) * 10);
          display: grid;
          grid-template-columns: calc(var(--u) * 22) 1fr;
          grid-template-rows: auto 1fr auto;
          column-gap: calc(var(--u) * 4);
        }
        .pace-caps {
          font-family: var(--mk-sans);
          font-size: var(--mk-label);
          font-weight: 600;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: var(--mk-muted);
        }
        #pace-head {
          grid-column: 1 / -1;
          display: flex;
          justify-content: space-between;
          padding-bottom: calc(var(--u) * 1.6);
        }
        #pace-head-rule,
        #pace-foot-rule {
          position: absolute;
          left: 0;
          right: 0;
          height: 1px;
          background: var(--mk-text);
          transform-origin: 0 50%;
        }
        #pace-head-rule {
          top: calc(var(--u) * 4.6);
        }
        #pace-foot-rule {
          bottom: calc(var(--u) * 4.4);
          opacity: 0.35;
        }
        #pace-name {
          color: var(--mk-accent);
        }
        #pace-margin {
          align-self: center;
          display: flex;
          flex-direction: column;
          gap: calc(var(--u) * 1.4);
          padding-top: calc(var(--u) * 2.4);
          border-top: 2px solid var(--mk-accent);
          margin-top: calc(var(--u) * -14);
        }
        #pace-folio {
          font-family: var(--mk-display);
          font-style: italic;
          font-size: calc(var(--u) * 7);
          line-height: 1;
          color: var(--mk-accent);
        }
        #pace-main {
          align-self: center;
          display: flex;
          flex-direction: column;
          gap: calc(var(--u) * 3.6);
        }
        #pace-title {
          margin: 0;
          font-family: var(--mk-display);
          font-weight: var(--mk-display-weight);
          font-size: calc(var(--u) * 12.5);
          line-height: 1;
          letter-spacing: -0.025em;
          max-width: 11ch;
        }
        #pace-standfirst {
          margin: 0;
          font-family: var(--mk-display);
          font-style: italic;
          font-size: calc(var(--u) * 3.8);
          line-height: 1.35;
          color: var(--mk-muted);
          max-width: 34ch;
        }
        #pace-foot {
          grid-column: 1 / -1;
          display: flex;
          justify-content: space-between;
        }
      </style>
      <div
        id="pace-root"
        class="mk-scene"
        data-composition-id="pace"
        data-width="1920"
        data-height="1080"
      >
        <div id="pace-page">
          <div id="pace-head-rule"></div>
          <div id="pace-head">
            <span id="pace-name" class="pace-caps" data-sample>Field notes</span>
            <span id="pace-issue" class="pace-caps" data-sample>No. 12 — Autumn</span>
          </div>
          <div id="pace-margin">
            <span id="pace-folio" data-sample>01</span>
            <span id="pace-kind" class="pace-caps" data-sample>Essay</span>
          </div>
          <div id="pace-main">
            <h1 id="pace-title" data-sample>A different kind of pace.</h1>
            <p id="pace-standfirst" data-sample>
              Notes from a studio that writes things down before it builds them.
            </p>
          </div>
          <div id="pace-foot-rule"></div>
          <div id="pace-foot">
            <span id="pace-time" class="pace-caps" data-sample>Reading time — 4 min</span>
            <span id="pace-page-no" class="pace-caps" data-sample>p. 1</span>
          </div>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          // The page is set like print: rules first, then the running head, then the words.
          tl.fromTo(
            '#pace-head-rule',
            { scaleX: 0 },
            { scaleX: 1, duration: 1.2, ease: MK.ease.move },
            0.1,
          )
          tl.fromTo(
            '#pace-head > *',
            { opacity: 0, y: '0.5em' },
            { opacity: 1, y: 0, duration: 0.8, ease: MK.ease.enter, stagger: 0.12 },
            0.35,
          )
          MK.revealLines(tl, '#pace-title', 0.55, { duration: 1.1, stagger: 0.24 })
          tl.fromTo(
            '#pace-margin',
            { opacity: 0, y: '1em' },
            { opacity: 1, y: 0, duration: 1, ease: MK.ease.enter },
            1.05,
          )
          MK.revealLines(tl, '#pace-standfirst', 1.35, { duration: 0.9, stagger: 0.16 })
          tl.fromTo(
            '#pace-foot-rule',
            { scaleX: 0 },
            { scaleX: 1, duration: 1.2, ease: MK.ease.move },
            1.4,
          )
          tl.fromTo(
            '#pace-foot > *',
            { opacity: 0 },
            { opacity: 1, duration: 0.8, ease: 'power1.out', stagger: 0.12 },
            1.8,
          )
          MK.pushIn(tl, '#pace-page', 0, 4, { to: 1.02 })
          window.__timelines['pace'] = tl
        })
      </script>
    </template>
  </body>
</html>
