<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Field notes</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="blocks/motion-kit.css" />
    <link rel="stylesheet" href="blocks/style.css" />
    <script src="blocks/motion-kit.js"></script>
    <style>
      :root {
        /* 1% of the shorter frame edge; every block and scene sizes from it. */
        --u: 10.8px;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #finish {
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      Field notes: an editorial opening page, a document tracked from desk to desk, and the same
      document docking into a printed spread while the camera pulls back to show the whole page.
      The card's last pose in "handoff" matches its first pose in "page" (see the CARD constants
      in both scenes), so the fade between them reads as one continuous object.
      Retiming a scene: change its data-start/data-duration here and the transition times below.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11.6"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="pace"
        data-composition-id="pace"
        data-composition-src="compositions/pace.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="handoff"
        data-composition-id="handoff"
        data-composition-src="compositions/handoff.html"
        data-start="3.2"
        data-duration="4.2"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="page"
        data-composition-id="page"
        data-composition-src="compositions/page.html"
        data-start="6.8"
        data-duration="4.8"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="finish"
        data-composition-id="finish"
        data-composition-src="compositions/finish.html"
        data-start="0"
        data-duration="11.6"
        data-track-index="9"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      // Page slide: the next sheet is laid over the last one from the right, which recedes a little.
      tl.fromTo(
        '#handoff',
        { xPercent: 100 },
        { xPercent: 0, duration: 0.8, ease: 'power3.inOut' },
        3.2,
      )
      tl.fromTo(
        '#pace',
        { xPercent: 0, opacity: 1 },
        { xPercent: -16, opacity: 0.5, duration: 0.8, ease: 'power3.inOut' },
        3.2,
      )
      // A gentle fade where the same document carries across.
      MK.transition(tl, 'fade', '#handoff', '#page', 6.8, { duration: 0.6 })
      window.__timelines['main'] = tl
    </script>
  </body>
</html>
