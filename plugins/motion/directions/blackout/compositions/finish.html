<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #finish-root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        /* A tighter vignette in the token colour, at 70%: it must not smudge the bone sheet. */
        #finish-vignette {
          background: radial-gradient(ellipse at center, transparent 62%, var(--mk-vignette));
          opacity: 0.7;
        }
      </style>
      <!-- Finishing pass over the whole film: held grain and a soft vignette. Keep it subtle. -->
      <div id="finish-root" data-composition-id="finish" data-width="1920" data-height="1080">
        <svg class="mk-grain" xmlns="http://www.w3.org/2000/svg">
          <filter id="finish-noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1" />
          </filter>
          <rect width="100%" height="100%" filter="url(#finish-noise)" />
        </svg>
        <div id="finish-vignette" class="mk-vignette"></div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          MK.grain(tl, '#finish-root', 14.5)
          // The inverted "louder" sheet (8–10.3 s) gets almost no vignette; the shutter brings it back.
          tl.fromTo('#finish-vignette', { opacity: 0.7 }, { opacity: 0.1, duration: 0.01 }, 8)
          tl.fromTo(
            '#finish-vignette',
            { opacity: 0.1 },
            { opacity: 0.7, duration: 0.3, immediateRender: false },
            10.45,
          )
          window.__timelines['finish'] = tl
        })
      </script>
    </template>
  </body>
</html>
