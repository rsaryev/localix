<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Blackout</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="blocks/motion-kit.css" />
    <link rel="stylesheet" href="blocks/style.css" />
    <script src="blocks/motion-kit.js"></script>
    <style>
      :root {
        /* 1% of the shorter frame edge; every block and scene sizes from it. */
        --u: 10.8px;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #finish {
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      Blackout: a typography study in five beats on one 12-column grid. Hard cuts land on the beat;
      the two straight wipes (left-to-right, then top-down) are the only transitions.
      Retiming a scene: change its data-start/data-duration here and the wipe times below.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="noise"
        data-composition-id="noise"
        data-composition-src="compositions/noise.html"
        data-start="0"
        data-duration="2.9"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="room"
        data-composition-id="room"
        data-composition-src="compositions/room.html"
        data-start="2.9"
        data-duration="2.8"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="idea"
        data-composition-id="idea"
        data-composition-src="compositions/idea.html"
        data-start="5.2"
        data-duration="2.8"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="louder"
        data-composition-id="louder"
        data-composition-src="compositions/louder.html"
        data-start="8"
        data-duration="2.8"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="blackout"
        data-composition-id="blackout"
        data-composition-src="compositions/blackout.html"
        data-start="10.3"
        data-duration="4.2"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="finish"
        data-composition-id="finish"
        data-composition-src="compositions/finish.html"
        data-start="0"
        data-duration="14.5"
        data-track-index="9"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      // Straight wipes only: room → idea reads left to right (its hairline edge lives in idea.html),
      // louder → blackout drops like a shutter. Everything else is a hard cut.
      tl.fromTo(
        '#idea',
        { clipPath: 'inset(0 100% 0 0)' },
        { clipPath: 'inset(0 0% 0 0)', duration: 0.5, ease: 'expo.inOut' },
        5.2,
      )
      tl.fromTo(
        '#blackout',
        { clipPath: 'inset(0 0 100% 0)' },
        { clipPath: 'inset(0 0 0% 0)', duration: 0.5, ease: 'expo.inOut' },
        10.3,
      )
      window.__timelines['main'] = tl
    </script>
  </body>
</html>
