<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Relay</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="blocks/motion-kit.css" />
    <link rel="stylesheet" href="blocks/style.css" />
    <script src="blocks/motion-kit.js"></script>
    <style>
      :root {
        /* 1% of the shorter frame edge; every block and scene sizes from it. */
        --u: 10.8px;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #finish {
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      Relay — a camera study in three shots: the dock close-up, the isolated mark, the product
      (tilt, click, zoom, wide pullback). Scenes overlap by their transition. Retiming a scene:
      change its data-start/data-duration here and the transition times below.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12.1"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="dock"
        data-composition-id="dock"
        data-composition-src="compositions/dock.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="mark"
        data-composition-id="mark"
        data-composition-src="compositions/mark.html"
        data-start="2.5"
        data-duration="2.8"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="product"
        data-composition-id="product"
        data-composition-src="compositions/product.html"
        data-start="4.7"
        data-duration="7.4"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="finish"
        data-composition-id="finish"
        data-composition-src="compositions/finish.html"
        data-start="0"
        data-duration="12.1"
        data-track-index="9"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      // The camera dives into the dock icon and blurs through to the mark; the mark scales
      // through to the product. Two kinds only: blur-through and zoom.
      MK.transition(tl, 'blur', '#dock', '#mark', 2.6, { duration: 0.4 })
      // Scale-through: the mark rushes past the lens while the product resolves out of a blur.
      tl.to('#mark', { scale: 2.4, filter: 'blur(16px)', duration: 0.4, ease: 'power2.in' }, 4.7)
      tl.to('#mark', { opacity: 0, duration: 0.3, ease: 'power1.in' }, 4.75)
      tl.fromTo(
        '#product',
        { opacity: 0, filter: 'blur(12px)' },
        { opacity: 1, filter: 'blur(0px)', duration: 0.45, ease: 'power2.out' },
        4.98,
      )
      window.__timelines['main'] = tl
    </script>
  </body>
</html>
