        .product-dock-tile.is-hero svg {

        #product-copy {

          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: calc(var(--u) * 2.8);
          translate: 0 -50%;
          text-align: left;
        }
        #product-copy .product-chip-mark {
          width: calc(var(--u) * 7);
          height: calc(var(--u) * 7);
          border-radius: calc(var(--u) * 1.8);
        }
        #product-headline {
          font-size: calc(var(--u) * 8.4);
          font-weight: 600;
          max-width: 12ch;
        }
        #product-cursor {
          left: 0;
          top: 0;
        }
      </style>

                <div id="product-app">
                  <div id="product-side">
                    <div id="product-brand">
                      <span class="product-chip-mark"
                        ><svg viewBox="0 0 24 24">

                  <div id="product-main">
                    <div id="product-head">

                      <div id="product-share" data-sample>Share</div>

                      <div class="product-col">
                        <div class="product-col-head">

      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const $ = (s) => document.querySelector(s)
          const cam = $('#product-camera')
          const body = $('#product-browser .mk-browser-body')
          const u =
            parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 10.8
          // TARGETS: anchors in the mock, or fractions of the body for a screenshot.
          const centre = (sel, fx, fy) => {
            const el = $(sel)
            const o = MK.offsetWithin(el || body, cam)
            return el
              ? { x: o.x + o.width / 2, y: o.y + o.height / 2 }
              : { x: o.x + o.width * fx, y: o.y + o.height * fy }
          }
          const g = MK.withLayout(cam, () => {
            const b = MK.offsetWithin(body, cam)
            const link = centre('#product-link', 0.55, 0.42)
            const from = centre('#product-from', 0.3, 0.45)
            const to = centre('#product-to', 0.55, 0.38)
            let wire = null
            if ($('#product-from') && $('#product-to')) {
              const board = $('#product-board')
              const f = MK.offsetWithin('#product-from', board)
              const t = MK.offsetWithin('#product-to', board)
              const a = { x: f.x + f.width, y: f.y + f.height / 2 }
              const z = { x: t.x, y: t.y + t.height / 2 }
              const k = (z.x - a.x) * 0.55
              wire = {
                a,
                z,
                d: `M ${a.x} ${a.y} C ${a.x + k} ${a.y} ${z.x - k} ${z.y} ${z.x} ${z.y}`,
              }
            }
            return {
              W: cam.offsetWidth,
              H: cam.offsetHeight,
              b,
              link,
              focus: { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 + 6 * u },
              wire,
            }
          })
          // Shot 1: the UI rises tilted and settles flat.
          tl.fromTo(
            '#product-browser',
            { rotationX: 26, rotationZ: -4, y: 14 * u, scale: 0.86, transformPerspective: 1800 },
            { rotationX: 0, rotationZ: 0, y: 0, scale: 1, duration: 1.5, ease: MK.ease.enter },
            0.05,
          )
          tl.fromTo(
            '#product-board .product-card',
            { opacity: 0, y: 1.6 * u },
            { opacity: 1, y: 0, duration: 0.55, ease: MK.ease.soft, stagger: 0.05 },
            0.5,
          )
          // Shot 2: the cursor arrives on a curve, settles, clicks; the UI answers within 0.1 s.
          const local = (p) => ({ x: p.x - g.b.x, y: p.y - g.b.y })
          const start = { x: g.b.width * 0.8, y: g.b.height * 0.96 }
          const arrive = MK.cursorPath(
            tl,
            '#product-cursor',
            [start, { ...local(g.link), travel: 0.8 }],
            1.0,
          )
          tl.fromTo('#product-cursor', { opacity: 0 }, { opacity: 1, duration: 0.25 }, 1.0)
          const press = arrive - 0.2
          MK.click(tl, '#product-cursor', press)
          if ($('#product-link')) {
            tl.fromTo(
              '#product-link-fill',
              { opacity: 0 },
              { opacity: 1, duration: 0.12 },
              press + 0.05,
            )
            tl.to(
              '#product-link-label',
              {
                color: getComputedStyle(document.documentElement)
                  .getPropertyValue('--mk-bg')
                  .trim(),
                duration: 0.12,
              },
              press + 0.05,
            )
          }
          if ($('#product-ring'))
            tl.fromTo(
              '#product-ring',
              { opacity: 0 },
              { opacity: 1, duration: 0.3, ease: MK.ease.soft },
              press + 0.08,
            )
          if (g.wire) {
            $('#product-wire-path').setAttribute('d', g.wire.d)
            gsap.set('#product-wire-a', { attr: { cx: g.wire.a.x, cy: g.wire.a.y } })
            gsap.set('#product-wire-b', { attr: { cx: g.wire.z.x, cy: g.wire.z.y } })
            gsap.set('#product-badge', {
              left: (g.wire.a.x + g.wire.z.x) / 2,
              top: (g.wire.a.y + g.wire.z.y) / 2,
              xPercent: -50,
              yPercent: -50,
            })
            tl.fromTo(
              '#product-wire-b',
              { scale: 0, transformOrigin: '50% 50%' },
              { scale: 1, duration: 0.25, ease: MK.ease.soft },
              press + 0.1,
            )
            MK.drawPath(tl, '#product-wire-path', press + 0.12, 0.55)
            tl.fromTo(
              '#product-wire-a',
              { scale: 0, transformOrigin: '50% 50%' },
              { scale: 1, duration: 0.25, ease: MK.ease.soft },
              press + 0.6,
            )
            tl.fromTo(
              '#product-badge',
              { scale: 0.4, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.6, ease: MK.ease.pop },
              press + 0.55,
            )
          } else gsap.set('#product-wire, #product-badge', { display: 'none' })
          // Shot 3: zoom 1.8× into the connection that matters.
          const Z = 1.9
          tl.to(
            cam,
            {
              x: (g.W / 2 - g.focus.x) * Z,
              y: (g.H / 2 - g.focus.y) * Z,
              scale: Z,
              duration: 0.95,
              ease: MK.ease.move,
            },
            press + 0.1,
          )
          tl.to('#product-cursor', { opacity: 0, duration: 0.3 }, press + 1.25)
          // Shot 4: the wide pullback. The desk comes into view, turned toward the line.
          const P = 0.62
          tl.fromTo(
            cam,
            { rotationY: 0, rotationX: 0, transformPerspective: 2400 },
            {
              rotationY: 16,
              rotationX: 3,
              transformPerspective: 2400,
              duration: 1.0,
              ease: MK.ease.move,
              immediateRender: false,
            },
            press + 1.55,
          )
          tl.to(
            cam,
            { x: g.W * 0.2, y: -7 * u, scale: P, duration: 1.0, ease: MK.ease.move },
            press + 1.55,
          )
          tl.fromTo(
            '#product-halo',
            { opacity: 0, scale: 0.7 },
            { opacity: 0.55, scale: 1, duration: 1.4, ease: MK.ease.move },
            press + 1.7,
          )
          tl.fromTo(
            '#product-copy-mark',
            { opacity: 0, scale: 0.7 },
            { opacity: 1, scale: 1, duration: 0.7, ease: MK.ease.enter },
            press + 2.05,
          )
          tl.fromTo(
            '#product-headline',
            { opacity: 0 },
            { opacity: 1, duration: 0.01 },
            press + 2.15,
          )
          MK.revealLines(tl, '#product-headline', press + 2.15, { duration: 0.65, stagger: 0.15 })
          tl.fromTo(
            '#product-url',
            { opacity: 0, y: 1.2 * u },
            { opacity: 1, y: 0, duration: 0.6, ease: MK.ease.soft },
            press + 2.3,
          )
          // The end frame stays alive with a slow, almost still drift.
          tl.to(cam, { rotationY: 13, duration: 2.9, ease: MK.ease.drift }, press + 2.55)
          window.__timelines['product'] = tl
        })
      </script>
    </template>
  </body>
