<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #dock-root {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(
              90% 60% at 50% 100%,
              color-mix(in srgb, var(--mk-accent) 14%, var(--mk-bg)),
              transparent 70%
            ),
            var(--mk-bg);
        }
        /* The camera: everything the lens sees. Trucks along the dock, then pushes into the mark. */
        #dock-rig {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding-top: calc(var(--u) * 22);
          box-sizing: border-box;
        }
        #dock-shelf {
          position: relative;
          display: flex;
          gap: calc(var(--u) * 2.6);
          padding: calc(var(--u) * 2.2);
        }
        #dock-bar {
          position: absolute;
          inset: calc(var(--u) * 5) 0 0;
          border-radius: calc(var(--u) * 5.4);
          background: linear-gradient(
            180deg,
            color-mix(in srgb, var(--mk-text) 9%, transparent),
            color-mix(in srgb, var(--mk-text) 3%, transparent)
          );
          box-shadow:
            inset 0 1px 0 color-mix(in srgb, var(--mk-text) 22%, transparent),
            0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0, 0, 0, 0.6);
        }
        .dock-slot {
          position: relative;
        }
        .dock-tile {
          position: relative;
          display: grid;
          place-items: center;
          width: calc(var(--u) * 18);
          height: calc(var(--u) * 18);
          border-radius: calc(var(--u) * 4.6);
          background: linear-gradient(
            160deg,
            color-mix(in srgb, var(--mk-text) 18%, var(--mk-surface)),
            var(--mk-surface) 55%,
            color-mix(in srgb, var(--mk-bg) 55%, var(--mk-surface))
          );
          box-shadow:
            inset 0 1px 0 color-mix(in srgb, var(--mk-text) 38%, transparent),
            inset 0 -2px 0 rgba(0, 0, 0, 0.35),
            0 calc(var(--u) * 2) calc(var(--u) * 4) rgba(0, 0, 0, 0.55);
          overflow: hidden;
        }
        .dock-tile::after {
          content: '';
          position: absolute;
          inset: 0 0 50%;
          background: linear-gradient(
            180deg,
            color-mix(in srgb, var(--mk-text) 14%, transparent),
            transparent
          );
        }
        .dock-tile svg {
          width: 46%;
          height: 46%;
          fill: none;
          stroke: var(--mk-text);
          stroke-opacity: 0.78;
          stroke-width: 1.6;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        /* The product's tile: the one accent in the shot. */
        #dock-hero {
          background: linear-gradient(
            155deg,
            color-mix(in srgb, var(--mk-accent) 70%, var(--mk-text)),
            var(--mk-accent) 45%,
            color-mix(in srgb, var(--mk-accent) 55%, var(--mk-bg))
          );
          box-shadow:
            inset 0 1px 0 color-mix(in srgb, var(--mk-text) 60%, transparent),
            0 0 calc(var(--u) * 7) color-mix(in srgb, var(--mk-accent) 45%, transparent),
            0 calc(var(--u) * 2) calc(var(--u) * 4) rgba(0, 0, 0, 0.55);
        }
        #dock-hero svg {
          stroke: var(--mk-bg);
          stroke-opacity: 1;
          stroke-width: 2.6;
        }
        #dock-dot {
          position: absolute;
          left: 50%;
          bottom: calc(var(--u) * -2.4);
          width: calc(var(--u) * 0.9);
          height: calc(var(--u) * 0.9);
          margin-left: calc(var(--u) * -0.45);
          border-radius: 50%;
          background: var(--mk-accent);
          box-shadow: 0 0 calc(var(--u) * 1.6) var(--mk-accent);
        }
        #dock-copy {
          position: absolute;
          left: var(--mk-safe);
          top: calc(var(--mk-safe) + var(--u) * 2);
          display: flex;
          flex-direction: column;
          gap: calc(var(--u) * 1.6);
        }
        #dock-title {
          font-size: calc(var(--u) * 10);
          font-weight: 600;
          max-width: none;
        }
      </style>
      <div
        id="dock-root"
        class="mk-scene"
        data-composition-id="dock"
        data-width="1920"
        data-height="1080"
      >
        <div id="dock-rig">
          <div id="dock-shelf">
            <div id="dock-bar"></div>
            <div class="dock-slot">
              <div class="dock-tile">
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="3.5" width="14" height="17" rx="2.5" />
                  <path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4" />
                </svg>
              </div>
            </div>
            <div class="dock-slot">
              <div class="dock-tile">
                <svg viewBox="0 0 24 24">
                  <rect x="3.5" y="5" width="17" height="15" rx="2.5" />
                  <path d="M3.5 9.5h17M8 3v4M16 3v4" />
                </svg>
              </div>
            </div>
            <div class="dock-slot">
              <div class="dock-tile">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M4 6.5a2.5 2.5 0 0 1 2.5-2.5h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5z"
                  />
                </svg>
              </div>
            </div>
            <div class="dock-slot">
              <div class="dock-tile">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"
                  />
                </svg>
              </div>
            </div>
            <div class="dock-slot">
              <div class="dock-tile">
                <svg viewBox="0 0 24 24">
                  <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" />
                  <path d="M3.5 16l5-5 4 4 2.5-2.5 5.5 5.5" />
                  <circle cx="15.5" cy="9" r="1.5" />
                </svg>
              </div>
            </div>
            <div class="dock-slot">
              <div class="dock-tile">
                <svg viewBox="0 0 24 24">
                  <rect x="3.5" y="5.5" width="17" height="13" rx="2.5" />
                  <path d="M4 7l8 6 8-6" />
                </svg>
              </div>
            </div>
            <div class="dock-slot">
              <!-- The product's app icon. Swap the rings for the real mark (inline SVG or <img src="assets/logo.svg">). -->
              <div id="dock-hero" class="dock-tile">
                <svg viewBox="0 0 24 24">
                  <circle cx="9" cy="12" r="5" />
                  <circle cx="15" cy="12" r="5" />
                </svg>
              </div>
              <div id="dock-dot"></div>
            </div>
            <div class="dock-slot">
              <div class="dock-tile">
                <svg viewBox="0 0 24 24">
                  <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" />
                  <path d="M7.5 10l3 2.5-3 2.5M12.5 15.5h4" />
                </svg>
              </div>
            </div>
            <div class="dock-slot">
              <div class="dock-tile">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="8.5" />
                  <path d="M15.5 8.5l-2 5-5 2 2-5z" />
                </svg>
              </div>
            </div>
          </div>
        </div>
        <div id="dock-copy">
          <div id="dock-label" class="mk-label" data-sample>Introducing Relay</div>
          <h1 id="dock-title" class="mk-hero" data-sample>Ideas, connected.</h1>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const rig = document.querySelector('#dock-rig')
          const tiles = [...document.querySelectorAll('#dock-root .dock-tile')]
          const hero = tiles.indexOf(document.querySelector('#dock-hero'))
          const u =
            parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 10.8
          // Measure tile centres inside the rig at build time (clips are hidden until they start).
          const { W, H, centres } = MK.withLayout(rig, () => ({
            W: rig.offsetWidth,
            H: rig.offsetHeight,
            centres: tiles.map((t) => {
              const o = MK.offsetWithin(t, rig)
              return { x: o.x + o.width / 2, y: o.y + o.height / 2 }
            }),
          }))
          const frame = (i, s, dy = 0) => ({
            x: (W / 2 - centres[i].x) * s,
            y: (H / 2 - centres[i].y) * s * dy,
          })
          // Shot 1: a close, low truck along the dock, from the third tile to the product's tile.
          const s0 = 1.55
          tl.fromTo(
            rig,
            { x: frame(2, s0).x, y: 0, scale: s0, rotationX: 30, transformPerspective: 1500 },
            { x: frame(hero, s0).x, scale: 1.7, rotationX: 22, duration: 2.05, ease: MK.ease.move },
            0,
          )
          // Rack focus travels with the camera: the tile in focus is sharp, the rest fall off.
          const focus = { f: 1.4 }
          const blurAll = () =>
            tiles.forEach((t, i) =>
              gsap.set(t, {
                filter: `blur(${Math.min(Math.abs(i - focus.f) * 0.32 * u, 1.3 * u).toFixed(2)}px)`,
              }),
            )
          blurAll()
          tl.to(focus, { f: hero, duration: 2.0, ease: MK.ease.move, onUpdate: blurAll }, 0.15)
          // The tactile beat: the product's icon lifts like a magnified dock tile, neighbours follow.
          tl.fromTo(
            '#dock-hero',
            { scale: 1, y: 0 },
            { scale: 1.16, y: -2.2 * u, duration: 0.55, ease: MK.ease.soft },
            1.75,
          )
          tl.fromTo(
            [tiles[hero - 1], tiles[hero + 1]],
            { scale: 1, y: 0 },
            { scale: 1.06, y: -0.8 * u, duration: 0.55, ease: MK.ease.soft },
            1.8,
          )
          tl.fromTo(
            '#dock-dot',
            { opacity: 0, scale: 0 },
            { opacity: 1, scale: 1, duration: 0.35, ease: MK.ease.soft },
            1.95,
          )
          // Push into the icon: the camera flattens and dives; the blur-through hands off to the mark.
          const end = frame(hero, 3.3, 1)
          tl.to(
            rig,
            {
              x: end.x,
              y: end.y + 2.2 * u * 3.3,
              scale: 3.3,
              rotationX: 0,
              duration: 0.7,
              ease: 'power2.in',
            },
            2.05,
          )
          tl.fromTo(
            '#dock-label',
            { opacity: 0, y: 0.8 * u },
            { opacity: 1, y: 0, duration: 0.6, ease: MK.ease.soft },
            0.15,
          )
          tl.fromTo('#dock-title', { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.25)
          MK.revealLines(tl, '#dock-title', 0.25, { exitAt: 1.95 })
          tl.to('#dock-label', { opacity: 0, duration: 0.3, ease: MK.ease.exit }, 1.95)
          window.__timelines['dock'] = tl
        })
      </script>
    </template>
  </body>
</html>
