<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #finish-root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        /* A very light ink vignette: paper stays paper. */
        #finish-root .mk-vignette {
          background: radial-gradient(ellipse at center, transparent 62%, var(--mk-text));
          opacity: 0.1;
        }
      </style>
      <!-- Finishing pass over the whole film: held grain and a warm vignette. Keep it subtle. -->
      <div id="finish-root" data-composition-id="finish" data-width="1920" data-height="1080">
        <svg class="mk-grain" xmlns="http://www.w3.org/2000/svg">
          <filter id="finish-noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1" />
          </filter>
          <rect width="100%" height="100%" filter="url(#finish-noise)" />
        </svg>
        <div class="mk-vignette"></div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          // Grain held at 12 fps: the turbulence seed steps once per held frame.
          const noise = document.querySelector('#finish-noise feTurbulence')
          tl.fromTo(
            noise,
            { attr: { seed: 1 } },
            { attr: { seed: 169 }, duration: 14, ease: 'steps(168)' },
            0,
          )
          window.__timelines['finish'] = tl
        })
      </script>
    </template>
  </body>
</html>
