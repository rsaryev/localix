<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* The change of register: ink ground, paper type, the same green. */
        #takeaway-root {
          position: absolute;
          inset: 0;
          background-color: var(--mk-text);
          background-image: repeating-linear-gradient(
            to bottom,
            transparent 0 calc(var(--u) * 6 - 1px),
            color-mix(in srgb, var(--mk-bg) 6%, transparent) calc(var(--u) * 6 - 1px)
              calc(var(--u) * 6)
          );
          color: var(--mk-bg);
        }
        .takeaway-edge {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: calc(var(--u) * 0.7);
          background: var(--mk-accent);
          z-index: 5;
        }
        .takeaway-top {
          position: absolute;
          left: var(--mk-safe);
          right: var(--mk-safe);
          top: calc(var(--u) * 5);
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-bottom: calc(var(--u) * 1.4);
          border-bottom: 2px solid var(--mk-bg);
        }
        #takeaway-root .mk-label {
          color: color-mix(in srgb, var(--mk-bg) 68%, var(--mk-text));
        }
        .takeaway-top .mk-label {
          color: var(--mk-bg);
        }
        #takeaway-grid {
          position: absolute;
          left: var(--mk-safe);
          right: var(--mk-safe);
          top: calc(var(--u) * 14);
          bottom: calc(var(--u) * 13);
          display: grid;
          grid-template-columns: 1fr auto;
          column-gap: calc(var(--u) * 8);
          align-items: center;
        }
        #takeaway-copy {
          display: flex;
          flex-direction: column;
          gap: calc(var(--u) * 3);
        }
        .takeaway-mask {
          display: block;
          overflow: hidden;
          padding-bottom: 0.1em;
        }
        .takeaway-line {
          display: block;
        }
        #takeaway-headline {
          margin: 0;
          font-size: calc(var(--u) * 13);
          line-height: 1;
          max-width: none;
          color: var(--mk-bg);
        }
        #takeaway-body {
          font-size: calc(var(--u) * 3.9);
          color: color-mix(in srgb, var(--mk-bg) 80%, var(--mk-text));
          max-width: 30ch;
        }
        #takeaway-spark {
          display: block;
          width: calc(var(--u) * 62);
          height: calc(var(--u) * 44.3);
          overflow: visible;
        }
        #takeaway-area {
          fill: color-mix(in srgb, var(--mk-accent) 22%, transparent);
        }
        #takeaway-line {
          fill: none;
          stroke: var(--mk-accent);
          stroke-width: 0.8;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #takeaway-base {
          stroke: color-mix(in srgb, var(--mk-bg) 35%, transparent);
          stroke-width: 0.25;
        }
        #takeaway-dot {
          fill: var(--mk-accent);
        }
        #takeaway-start {
          fill: var(--mk-bg);
        }
        .takeaway-svg-text {
          font-family: var(--mk-sans);
          font-variant-numeric: tabular-nums;
          font-weight: 700;
          fill: var(--mk-bg);
        }
        #takeaway-source {
          position: absolute;
          left: var(--mk-safe);
          right: var(--mk-safe);
          bottom: calc(var(--u) * 5);
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-top: calc(var(--u) * 1.4);
          border-top: 1px solid color-mix(in srgb, var(--mk-bg) 30%, transparent);
        }
        #takeaway-source .mk-label {
          letter-spacing: 0.1em;
        }
      </style>
      <div
        id="takeaway-root"
        class="mk-scene"
        data-composition-id="takeaway"
        data-width="1920"
        data-height="1080"
      >
        <div class="takeaway-top">
          <span class="mk-label" data-sample>State of shipping · 2025</span>
          <span class="mk-label">03 / 03</span>
        </div>
        <div id="takeaway-grid">
          <div id="takeaway-copy">
            <div id="takeaway-label" class="mk-label" data-sample>The takeaway</div>
            <h2 id="takeaway-headline" class="mk-hero">
              <span class="takeaway-mask"
                ><span id="takeaway-line-1" class="takeaway-line" data-sample
                  >Small changes</span
                ></span
              >
              <span class="takeaway-mask"
                ><span id="takeaway-line-2" class="takeaway-line mk-accent" data-sample
                  >compound.</span
                ></span
              >
            </h2>
            <p id="takeaway-body" data-sample>
              Ship a little every week and let the numbers tell the story.
            </p>
          </div>
          <!-- The bars' data as one line, in units of --u: x every 8u, y = 36 − value × 36 / 35. -->
          <svg id="takeaway-spark" viewBox="0 0 56 40">
            <path
              id="takeaway-area"
              d="M0 26.7 L8 25.7 L16 22.6 L24 19.5 L32 16.5 L40 12.3 L48 8.1 L56 4.1 L56 36 L0 36 Z"
            />
            <line id="takeaway-base" x1="0" y1="36" x2="56" y2="36" />
            <path
              id="takeaway-line"
              d="M0 26.7 L8 25.7 L16 22.6 L24 19.5 L32 16.5 L40 12.3 L48 8.1 L56 4.1"
            />
            <circle id="takeaway-start" cx="0" cy="26.7" r="1" />
            <circle id="takeaway-dot" cx="56" cy="4.1" r="1.6" />
            <text
              id="takeaway-start-label"
              class="takeaway-svg-text"
              x="0"
              y="33"
              font-size="3"
              data-sample
            >
              9
            </text>
            <text
              id="takeaway-end-label"
              class="takeaway-svg-text"
              x="52"
              y="1"
              font-size="4.4"
              text-anchor="end"
              data-sample
            >
              31
            </text>
          </svg>
        </div>
        <div id="takeaway-source">
          <span class="mk-label" data-sample
            >Illustrative figures — replace with verified data</span
          >
          <span class="mk-label" data-sample>Source: —</span>
        </div>
        <div class="takeaway-edge"></div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const u =
            parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 10.8
          const root = document.querySelector('#takeaway-root')
          const height = MK.withLayout(root, () => root.offsetHeight) || 100 * u
          const tl = gsap.timeline({ paused: true })
          tl.fromTo(
            '#takeaway-root .takeaway-edge',
            { y: height },
            { y: 0, duration: 0.6, ease: 'power3.inOut' },
            0,
          )
          tl.to(
            '#takeaway-root .takeaway-edge',
            { opacity: 0, duration: 0.3, ease: MK.ease.soft },
            0.6,
          )
          tl.fromTo(
            '#takeaway-label',
            { opacity: 0, y: 1.2 * u },
            { opacity: 1, y: 0, duration: MK.dur(0.6), ease: MK.ease.soft },
            0.35,
          )
          tl.fromTo(
            ['#takeaway-line-1', '#takeaway-line-2'],
            { yPercent: 125 },
            { yPercent: 0, duration: MK.dur(0.85), ease: MK.ease.enter, stagger: 0.22 },
            0.45,
          )
          // The whole story again in one stroke: the bars become a line that keeps climbing.
          tl.fromTo(
            '#takeaway-start',
            { scale: 0 },
            { scale: 1, duration: MK.dur(0.4), ease: MK.ease.soft, transformOrigin: '50% 50%' },
            0.8,
          )
          MK.drawPath(tl, '#takeaway-line', 0.9, MK.dur(1.1), { ease: 'power2.inOut' })
          tl.fromTo(
            '#takeaway-line',
            { opacity: 0 },
            { opacity: 1, duration: 0.05, ease: 'none' },
            0.9,
          )
          // The area fills in behind the line's tip, on the same curve.
          tl.fromTo(
            '#takeaway-area',
            { clipPath: 'inset(0% 100% 0% 0%)' },
            { clipPath: 'inset(0% 0% 0% 0%)', duration: MK.dur(1.1), ease: 'power2.inOut' },
            0.9,
          )
          tl.fromTo(
            '#takeaway-dot',
            { scale: 0, opacity: 0 },
            {
              scale: 1,
              opacity: 1,
              duration: MK.dur(0.5),
              ease: MK.ease.pop,
              transformOrigin: '50% 50%',
            },
            1.9,
          )
          tl.fromTo(
            '#takeaway-start-label',
            { opacity: 0 },
            { opacity: 1, duration: MK.dur(0.4), ease: MK.ease.soft },
            0.95,
          )
          tl.fromTo(
            '#takeaway-end-label',
            { opacity: 0, y: 1.5 },
            { opacity: 1, y: 0, duration: MK.dur(0.45), ease: MK.ease.soft },
            2.0,
          )
          MK.revealWords(tl, '#takeaway-body', 1.25)
          tl.fromTo(
            '#takeaway-source',
            { opacity: 0 },
            { opacity: 1, duration: MK.dur(0.6), ease: MK.ease.soft },
            1.7,
          )
          // Everything is still by ~2.4 s; the card then holds so the takeaway and source can be read.
          window.__timelines['takeaway'] = tl
        })
      </script>
    </template>
  </body>
</html>
