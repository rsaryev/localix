<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Momentum</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="blocks/motion-kit.css" />
    <link rel="stylesheet" href="blocks/style.css" />
    <script src="blocks/motion-kit.js"></script>
    <style>
      :root {
        /* 1% of the shorter frame edge; every block and scene sizes from it. */
        --u: 10.8px;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #finish {
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      Momentum: a headline figure, the bars behind it, then a change of register for the takeaway.
      figure (72%, circled) → bars (labelled axes, the change, 3.4×) → takeaway (ink panel, source line).
      Every transition wipes up, following growth. Retiming a scene: move the next slots and the times below.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="figure"
        data-composition-id="figure"
        data-composition-src="compositions/figure.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="bars"
        data-composition-id="bars"
        data-composition-src="compositions/bars.html"
        data-start="4.4"
        data-duration="5.2"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="takeaway"
        data-composition-id="takeaway"
        data-composition-src="compositions/takeaway.html"
        data-start="9"
        data-duration="5"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="finish"
        data-composition-id="finish"
        data-composition-src="compositions/finish.html"
        data-start="0"
        data-duration="14"
        data-track-index="9"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      // Wipes up, following growth: the next scene rises from the bottom edge (each scene draws a
      // green leading edge on its own) while the previous one is pushed up behind it.
      // Explicit units on every inset value: GSAP cannot interpolate "100%" to a unitless "0".
      const wipeUp = (incoming, at) =>
        tl.fromTo(
          incoming,
          { clipPath: 'inset(100% 0% 0% 0%)' },
          { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.6, ease: 'power3.inOut' },
          at,
        )
      wipeUp('#bars', 4.4)
      tl.to('#figure', { yPercent: -10, duration: 0.6, ease: 'power3.inOut' }, 4.4)
      // The change of register: an ink panel wipes up over the paper.
      wipeUp('#takeaway', 9)
      tl.to('#bars', { yPercent: -10, duration: 0.6, ease: 'power3.inOut' }, 9)
      window.__timelines['main'] = tl
    </script>
  </body>
</html>
