<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Nightfall</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="blocks/motion-kit.css" />
    <link rel="stylesheet" href="blocks/style.css" />
    <script src="blocks/motion-kit.js"></script>
    <style>
      :root {
        /* 1% of the shorter frame edge; every block and scene sizes from it. */
        --u: 10.8px;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #finish {
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      Nightfall: a calm brand study in five centred scenes. Each scene has one glowing ember focal
      point; arrivals are slow (1–1.4 s) and holds are long. Soft fades between scenes, one circular
      iris into "gestures", and an aperture of blades that opens on the brand mark at the end.
      Retiming a scene: change its data-start/data-duration here and the transition times below.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16.8"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="quiet"
        data-composition-id="quiet"
        data-composition-src="compositions/quiet.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="perspective"
        data-composition-id="perspective"
        data-composition-src="compositions/perspective.html"
        data-start="3.4"
        data-duration="3.6"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="impression"
        data-composition-id="impression"
        data-composition-src="compositions/impression.html"
        data-start="6.4"
        data-duration="3.8"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="gestures"
        data-composition-id="gestures"
        data-composition-src="compositions/gestures.html"
        data-start="9.4"
        data-duration="3.4"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="signature"
        data-composition-id="signature"
        data-composition-src="compositions/signature.html"
        data-start="12.2"
        data-duration="4.6"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="finish"
        data-composition-id="finish"
        data-composition-src="compositions/finish.html"
        data-start="0"
        data-duration="16.8"
        data-track-index="9"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      // Soft fades carry the story; one circular iris marks the turn into the closing gesture.
      MK.transition(tl, 'fade', '#quiet', '#perspective', 3.4, { duration: 0.6 })
      MK.transition(tl, 'fade', '#perspective', '#impression', 6.4, { duration: 0.6 })
      MK.transition(tl, 'iris', '#impression', '#gestures', 9.4, { duration: 0.8 })
      MK.transition(tl, 'fade', '#gestures', '#signature', 12.2, { duration: 0.6 })
      window.__timelines['main'] = tl
    </script>
  </body>
</html>
