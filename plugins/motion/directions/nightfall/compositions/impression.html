<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #impression-root {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            ellipse 70% 70% at 50% 50%,
            color-mix(in srgb, var(--mk-surface) 92%, var(--mk-bg)),
            var(--mk-bg) 80%
          );
        }
        #impression-stage {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
        }
        /* A disc pressed into the surface: the impression the line talks about. */
        #impression-disc,
        #impression-shade,
        .impression-ring {
          grid-area: 1 / 1;
          width: calc(var(--u) * 58);
          height: calc(var(--u) * 58);
          border-radius: 50%;
        }
        #impression-disc {
          background: radial-gradient(
            circle at 50% 38%,
            color-mix(in srgb, var(--mk-surface) 70%, var(--mk-bg)),
            var(--mk-bg) 75%
          );
        }
        #impression-shade {
          box-shadow:
            inset 0 calc(var(--u) * 1.6) calc(var(--u) * 3.2) rgba(0, 0, 0, 0.62),
            inset 0 calc(var(--u) * -0.35) calc(var(--u) * 0.9)
              color-mix(in srgb, var(--mk-text) 9%, transparent),
            0 calc(var(--u) * 0.2) 0 color-mix(in srgb, var(--mk-text) 5%, transparent);
        }
        .impression-ring {
          border: 1px solid color-mix(in srgb, var(--mk-text) 22%, transparent);
        }
        #impression-arc {
          grid-area: 1 / 1;
          width: calc(var(--u) * 62);
          height: calc(var(--u) * 62);
          overflow: visible;
          filter: drop-shadow(0 0 calc(var(--u) * 0.8) var(--mk-accent));
        }
        #impression-arc path {
          fill: none;
          stroke: var(--mk-accent);
          stroke-width: 0.5;
          stroke-linecap: round;
        }
        #impression-type {
          grid-area: 1 / 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        #impression-a,
        #impression-b {
          margin: 0;
          font-size: calc(var(--u) * 8.6);
          max-width: none;
        }
        #impression-a {
          color: var(--mk-muted);
        }
        #impression-b {
          font-style: italic;
        }
      </style>
      <div
        id="impression-root"
        class="mk-scene"
        data-composition-id="impression"
        data-width="1920"
        data-height="1080"
      >
        <div id="impression-stage" data-layout-allow-overflow>
          <div id="impression-ring-a" class="impression-ring"></div>
          <div id="impression-ring-b" class="impression-ring"></div>
          <div id="impression-disc"></div>
          <div id="impression-shade"></div>
          <!-- An ember rim light on the lower right of the pressed disc. -->
          <svg id="impression-arc" viewBox="-31 -31 62 62" aria-hidden="true">
            <path id="impression-arc-path" d="M 28.2 11.4 A 30.4 30.4 0 0 1 -6.3 29.7" />
          </svg>
          <div id="impression-type">
            <h2 id="impression-a" class="mk-hero" data-sample>Leave an</h2>
            <h2 id="impression-b" class="mk-hero" data-sample>impression.</h2>
          </div>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          // The press: the disc settles into the surface and its shadow deepens.
          tl.fromTo(
            '#impression-disc',
            { scale: 1.07, opacity: 0 },
            { scale: 1, opacity: 1, duration: 1.4, ease: MK.ease.enter },
            0.1,
          )
          tl.fromTo(
            '#impression-shade',
            { scale: 1.07, opacity: 0 },
            { scale: 1, opacity: 1, duration: 1.4, ease: MK.ease.enter },
            0.25,
          )
          // One quiet ripple travels out from the contact.
          tl.fromTo(
            '#impression-ring-a',
            { scale: 1, opacity: 0.55 },
            { scale: 1.55, opacity: 0, duration: 2.4, ease: 'power2.out' },
            0.45,
          )
          tl.fromTo(
            '#impression-ring-b',
            { scale: 1, opacity: 0.35 },
            { scale: 1.3, opacity: 0, duration: 2.4, ease: 'power2.out' },
            0.75,
          )
          MK.revealLines(tl, '#impression-a', 0.65, { duration: 1.2 })
          MK.revealLines(tl, '#impression-b', 0.9, { duration: 1.2 })
          // The ember catches the rim after the words land, then drifts around it.
          MK.drawPath(tl, '#impression-arc-path', 1.5, 1.3, { ease: 'power2.out' })
          tl.fromTo(
            '#impression-arc',
            { rotation: -24 },
            { rotation: 14, duration: 3.8, ease: 'none' },
            0,
          )
          tl.to('#impression-type', { opacity: 0, duration: 0.4, ease: MK.ease.exit }, 2.95)
          MK.pushIn(tl, '#impression-stage', 0, 3.8, { to: 1.03 })
          window.__timelines['impression'] = tl
        })
      </script>
    </template>
  </body>
</html>
