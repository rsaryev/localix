<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #finish-root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
      </style>
      <!-- Finishing pass over the whole film: held grain and a soft vignette. Keep it subtle. -->
      <div id="finish-root" data-composition-id="finish" data-width="1920" data-height="1080">
        <svg id="finish-grain" class="mk-grain" xmlns="http://www.w3.org/2000/svg">
          <filter id="finish-noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1" />
          </filter>
          <rect width="100%" height="100%" filter="url(#finish-noise)" />
        </svg>
        <div class="mk-vignette"></div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          MK.grain(tl, '#finish-grain', 16.8)
          window.__timelines['finish'] = tl
        })
      </script>
    </template>
  </body>
</html>
