<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #signature-root {
          position: absolute;
          inset: 0;
          --signature-y: 39%;
        }
        #signature-glow {
          position: absolute;
          left: 50%;
          top: var(--signature-y);
          width: calc(var(--u) * 60);
          height: calc(var(--u) * 60);
          margin: calc(var(--u) * -30) 0 0 calc(var(--u) * -30);
          border-radius: 50%;
          background: radial-gradient(
            closest-side,
            color-mix(in srgb, var(--mk-accent) 42%, transparent),
            color-mix(in srgb, var(--mk-accent) 8%, transparent) 55%,
            transparent
          );
        }
        /* The brand mark: an ember sun setting into its own reflection. Replace with the logo. */
        #signature-mark {
          position: absolute;
          left: 50%;
          top: var(--signature-y);
          width: calc(var(--u) * 22);
          height: calc(var(--u) * 22);
          margin: calc(var(--u) * -11) 0 0 calc(var(--u) * -11);
          overflow: visible;
        }
        #signature-mark .sun {
          fill: var(--mk-accent);
        }
        /* The aperture: seven blades the colour of the night, only their edges catch light. */
        #signature-iris {
          position: absolute;
          left: 50%;
          top: var(--signature-y);
          width: calc(var(--u) * 260);
          height: calc(var(--u) * 260);
          margin: calc(var(--u) * -130) 0 0 calc(var(--u) * -130);
        }
        #signature-blades {
          display: block;
          width: 100%;
          height: 100%;
        }
        .signature-plate {
          fill: var(--mk-bg);
        }
        .signature-edge {
          fill: none;
          stroke: color-mix(in srgb, var(--mk-text) 22%, transparent);
          stroke-width: 0.14;
        }
        #signature-type {
          position: absolute;
          left: var(--mk-safe);
          right: var(--mk-safe);
          top: 63%;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: calc(var(--u) * 2.2);
          text-align: center;
        }
        #signature-name {
          font-size: calc(var(--u) * 11);
          max-width: none;
        }
        #signature-line {
          letter-spacing: 0.34em;
          font-weight: 500;
        }
      </style>
      <div
        id="signature-root"
        class="mk-scene"
        data-composition-id="signature"
        data-width="1920"
        data-height="1080"
      >
        <div id="signature-glow"></div>
        <svg id="signature-mark" viewBox="-11 -11 22 22" aria-hidden="true">
          <defs>
            <clipPath id="signature-disc"><circle r="10.5" /></clipPath>
          </defs>
          <g clip-path="url(#signature-disc)">
            <rect class="sun" x="-11" y="-11" width="22" height="13.2" />
            <rect class="sun" x="-11" y="3.6" width="22" height="1.3" opacity="0.72" />
            <rect class="sun" x="-11" y="6.2" width="22" height="1.05" opacity="0.48" />
            <rect class="sun" x="-11" y="8.4" width="22" height="0.85" opacity="0.28" />
          </g>
        </svg>
        <div id="signature-iris" data-layout-allow-overflow>
          <svg id="signature-blades" viewBox="-130 -130 260 260" aria-hidden="true"></svg>
        </div>
        <div id="signature-type">
          <div id="signature-name" class="mk-hero" data-sample>Nightfall.</div>
          <div id="signature-line" class="mk-label" data-sample>Quietly bold</div>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          // Build the aperture: seven curved blades. Each blade's inner edge is a shallow arc,
          // offset to one side, so closed blades sweep past the centre in a pinwheel and opening
          // them (moving each outward by `y`, in --u units) leaves a rounded seven-sided opening.
          const svg = document.querySelector('#signature-blades')
          const NS = 'http://www.w3.org/2000/svg'
          const k = 0.0045
          const shift = 38
          const edge = []
          for (let x = -200; x <= 200; x += 8)
            edge.push(`${x} ${(-k * (x - shift) ** 2).toFixed(2)}`)
          const plateD = `M ${edge.join(' L ')} L 200 260 L -200 260 Z`
          const edgeD = `M ${edge.join(' L ')}`
          if (!svg.childElementCount)
            for (let i = 0; i < 7; i++) {
              const turn = document.createElementNS(NS, 'g')
              turn.setAttribute('transform', `rotate(${(360 / 7) * i})`)
              const blade = document.createElementNS(NS, 'g')
              blade.setAttribute('class', 'signature-blade')
              const plate = document.createElementNS(NS, 'path')
              plate.setAttribute('class', 'signature-plate')
              plate.setAttribute('d', plateD)
              const line = document.createElementNS(NS, 'path')
              line.setAttribute('class', 'signature-edge')
              line.setAttribute('d', edgeD)
              blade.append(plate, line)
              turn.append(blade)
              svg.append(turn)
            }

          const tl = gsap.timeline({ paused: true })
          // Tracking open without reflow: each letter slides in from a wider spacing.
          const trackOpen = (target, at, spread = 0.3) => {
            const chars = [...MK.split(target, 'chars').querySelectorAll('.mk-char')]
            const size = parseFloat(getComputedStyle(document.querySelector(target)).fontSize)
            const mid = (chars.length - 1) / 2
            tl.fromTo(
              chars,
              { x: (i) => (i - mid) * size * spread, opacity: 0 },
              { x: 0, opacity: 1, duration: 1.4, ease: MK.ease.enter },
              at,
            )
          }
          // Closed, then the aperture opens in one slow turn and the ember pours through.
          tl.fromTo(
            '.signature-blade',
            { y: 0 },
            { y: 24, duration: 1.7, ease: 'power3.inOut' },
            0.45,
          )
          tl.fromTo(
            '#signature-iris',
            { rotation: 0 },
            { rotation: -36, duration: 1.9, ease: 'power3.inOut' },
            0.35,
          )
          tl.fromTo(
            '#signature-glow',
            { opacity: 0, scale: 0.5 },
            { opacity: 1, scale: 1, duration: 2.2, ease: MK.ease.move },
            0.7,
          )
          tl.fromTo(
            '#signature-mark',
            { scale: 0.88 },
            { scale: 1, duration: 2.6, ease: 'power2.out' },
            0.45,
          )
          MK.revealLines(tl, '#signature-name', 1.75, { duration: 1.3 })
          trackOpen('#signature-line', 2.1)
          // The blade edges recede so the mark is the only light left. Then everything holds.
          tl.fromTo(
            '.signature-edge',
            { opacity: 1 },
            { opacity: 0.4, duration: 1.4, ease: 'power2.out' },
            2.2,
          )
          window.__timelines['signature'] = tl
        })
      </script>
    </template>
  </body>
</html>
