<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #quiet-root {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            ellipse 62% 58% at 50% 54%,
            color-mix(in srgb, var(--mk-surface) 85%, var(--mk-bg)),
            var(--mk-bg) 72%
          );
        }
        /* The one glowing focal point: an ember horizon the headline rises from. */
        #quiet-bloom {
          position: absolute;
          left: 50%;
          top: 50%;
          width: calc(var(--u) * 64);
          height: calc(var(--u) * 22);
          margin: calc(var(--u) * -6) 0 0 calc(var(--u) * -32);
          border-radius: 50%;
          background: radial-gradient(
            closest-side,
            color-mix(in srgb, var(--mk-accent) 26%, transparent),
            transparent
          );
          filter: blur(calc(var(--u) * 3));
        }
        #quiet-stage {
          gap: 0;
        }
        #quiet-label {
          margin-bottom: calc(var(--u) * 3.4);
          letter-spacing: 0.34em;
          font-weight: 500;
        }
        #quiet-title {
          margin: 0;
          font-size: calc(var(--u) * 13.5);
          max-width: 14ch;
          line-height: 1.02;
        }
        #quiet-horizon {
          position: relative;
          width: calc(var(--u) * 58);
          height: calc(var(--u) * 0.22);
          margin-top: calc(var(--u) * 1.2);
          background: linear-gradient(
            90deg,
            transparent,
            color-mix(in srgb, var(--mk-accent) 70%, transparent) 30%,
            var(--mk-accent) 50%,
            color-mix(in srgb, var(--mk-accent) 70%, transparent) 70%,
            transparent
          );
          box-shadow: 0 0 calc(var(--u) * 1.6) color-mix(in srgb, var(--mk-accent) 55%, transparent);
        }
        #quiet-sub {
          margin-top: calc(var(--u) * 3.6);
          font-family: var(--mk-display);
          font-style: italic;
          font-size: calc(var(--u) * 4.2);
          color: var(--mk-muted);
          max-width: 30ch;
        }
      </style>
      <div
        id="quiet-root"
        class="mk-scene"
        data-composition-id="quiet"
        data-width="1920"
        data-height="1080"
      >
        <div id="quiet-bloom"></div>
        <div id="quiet-stage" class="mk-center">
          <div id="quiet-label" class="mk-label" data-sample>An independent brand study</div>
          <h1 id="quiet-title" class="mk-hero" data-sample>Quietly bold.</h1>
          <div id="quiet-horizon"></div>
          <p id="quiet-sub" data-sample>Presence without the noise.</p>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          // Tracking open without reflow: each letter slides in from a wider spacing.
          const trackOpen = (target, at, spread = 0.3) => {
            const chars = [...MK.split(target, 'chars').querySelectorAll('.mk-char')]
            const size = parseFloat(getComputedStyle(document.querySelector(target)).fontSize)
            const mid = (chars.length - 1) / 2
            tl.fromTo(
              chars,
              { x: (i) => (i - mid) * size * spread, opacity: 0 },
              { x: 0, opacity: 1, duration: 1.4, ease: MK.ease.enter },
              at,
            )
          }
          // The ember light gathers first, then the horizon draws out from its centre.
          tl.fromTo(
            '#quiet-bloom',
            { opacity: 0, scale: 0.55 },
            { opacity: 1, scale: 1, duration: 2.6, ease: MK.ease.move },
            0,
          )
          tl.fromTo(
            '#quiet-horizon',
            { scaleX: 0, opacity: 0.4 },
            { scaleX: 1, opacity: 1, duration: 1.4, ease: MK.ease.enter },
            0.25,
          )
          // The headline rises out of the horizon, slow and unhurried.
          MK.revealLines(tl, '#quiet-title', 0.55, { duration: 1.35, stagger: 0.28 })
          tl.fromTo(
            '#quiet-sub',
            { opacity: 0, y: '0.4em' },
            { opacity: 1, y: 0, duration: 1.2, ease: MK.ease.enter },
            1.55,
          )
          trackOpen('#quiet-label', 1.3)
          // Leave quietly as the next scene fades in.
          tl.to('#quiet-bloom', { opacity: 0, duration: 0.6, ease: MK.ease.exit }, 3.1)
          tl.to(
            '#quiet-stage > *',
            { opacity: 0, y: '-0.15em', duration: 0.45, ease: MK.ease.exit, stagger: 0.04 },
            3.1,
          )
          MK.pushIn(tl, '#quiet-stage', 0, 4, { to: 1.03 })
          window.__timelines['quiet'] = tl
        })
      </script>
    </template>
  </body>
</html>
