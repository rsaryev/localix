<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Orbit</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="blocks/motion-kit.css" />
    <link rel="stylesheet" href="blocks/style.css" />
    <script src="blocks/motion-kit.js"></script>
    <style>
      :root {
        /* 1% of the shorter frame edge; every block and scene sizes from it. */
        --u: 10.8px;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #finish {
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      Orbit — a sculptural token, a product close-up, a sense of momentum, a confident sign-off.
      Scenes overlap by their transition. Retiming a scene: change its data-start/data-duration
      here and the transition times below.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="token"
        data-composition-id="token"
        data-composition-src="compositions/token.html"
        data-start="0"
        data-duration="4.2"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="closeup"
        data-composition-id="closeup"
        data-composition-src="compositions/closeup.html"
        data-start="3.7"
        data-duration="4"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="momentum"
        data-composition-id="momentum"
        data-composition-src="compositions/momentum.html"
        data-start="7.2"
        data-duration="3.1"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="signoff"
        data-composition-id="signoff"
        data-composition-src="compositions/signoff.html"
        data-start="9.8"
        data-duration="3.7"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="finish"
        data-composition-id="finish"
        data-composition-src="compositions/finish.html"
        data-start="0"
        data-duration="13.5"
        data-track-index="9"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      // Zoom (scale-through) for the turns that follow the object, blur-through for the big one.
      // The token rushes past the lens; the product resolves behind it.
      tl.to('#token', { scale: 2.2, filter: 'blur(16px)', duration: 0.45, ease: 'power2.in' }, 3.7)
      tl.to('#token', { opacity: 0, duration: 0.3, ease: 'power1.in' }, 3.75)
      tl.fromTo('#closeup', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 3.8)
      MK.transition(tl, 'blur', '#closeup', '#momentum', 7.2, { duration: 0.5 })
      MK.transition(tl, 'zoom', '#momentum', '#signoff', 9.8, { duration: 0.5 })
      window.__timelines['main'] = tl
    </script>
  </body>
</html>
