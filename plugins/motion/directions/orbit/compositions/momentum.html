<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #momentum-root {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            70% 80% at 100% 100%,
            color-mix(in srgb, var(--mk-accent) 9%, var(--mk-bg)),
            var(--mk-bg) 65%
          );
        }
        /* A trajectory across the frame: the satellite from the opening accelerates along it. */
        #momentum-field {
          position: absolute;
          inset: 0;
        }
        #momentum-svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        #momentum-guide {
          fill: none;
          stroke: var(--mk-line);
          stroke-width: 2;
        }
        #momentum-trail {
          fill: none;
          stroke: var(--mk-accent);
          stroke-width: 4;
          stroke-linecap: round;
          filter: drop-shadow(0 0 calc(var(--u) * 0.8) var(--mk-accent));
        }
        .momentum-node {
          fill: var(--mk-bg);
          stroke: var(--mk-muted);
          stroke-width: 2.5;
        }
        .momentum-lit {
          fill: var(--mk-accent);
          stroke: none;
        }
        .momentum-label {
          position: absolute;
          font-size: calc(var(--u) * 3);
          font-weight: 500;
          color: var(--mk-muted);
          white-space: nowrap;
        }
        #momentum-comet {
          position: absolute;
          left: calc(var(--u) * -1.6);
          top: calc(var(--u) * -1.6);
          width: calc(var(--u) * 3.2);
          height: calc(var(--u) * 3.2);
          border-radius: 50%;
          background: radial-gradient(circle at 35% 35%, var(--mk-text), var(--mk-accent) 55%);
          box-shadow:
            0 0 calc(var(--u) * 3) var(--mk-accent),
            0 0 calc(var(--u) * 8) color-mix(in srgb, var(--mk-accent) 50%, transparent);
        }
        #momentum-title {
          position: absolute;
          right: calc(var(--mk-safe) + var(--u) * 2);
          bottom: calc(var(--mk-safe) + var(--u) * 3);
          text-align: right;
          font-size: calc(var(--u) * 9);
          font-weight: 600;
          max-width: 10ch;
        }
      </style>
      <div
        id="momentum-root"
        class="mk-scene"
        data-composition-id="momentum"
        data-width="1920"
        data-height="1080"
      >
        <div id="momentum-field">
          <svg id="momentum-svg" aria-hidden="true">
            <path id="momentum-guide" d="M0 0" />
            <path id="momentum-trail" d="M0 0" />
          </svg>
          <div class="momentum-label" data-sample>Thought</div>
          <div class="momentum-label" data-sample>Draft</div>
          <div class="momentum-label" data-sample>Launch</div>
          <div id="momentum-comet"></div>
        </div>
        <!-- data-accent: the word painted in the accent after the lines are split. -->
        <h2 id="momentum-title" class="mk-hero" data-accent="momentum." data-sample>
          From thought to momentum.
        </h2>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const $ = (s) => document.querySelector(s)
          const root = $('#momentum-root')
          const u =
            parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 10.8
          const { W, H } = MK.withLayout(root, () => ({
            W: root.offsetWidth,
            H: root.offsetHeight,
          }))
          // A quarter ellipse anchored past the bottom-right corner, sampled into a polyline.
          const cx = W * 0.98,
            cy = H * 1.12,
            rx = W * 0.86,
            ry = H * 0.92
          const pts = []
          for (let i = 0; i <= 160; i++) {
            const a = Math.PI + 0.12 + (i / 160) * (Math.PI / 2 + 0.13)
            pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)])
          }
          const acc = [0]
          for (let i = 1; i < pts.length; i++)
            acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]))
          const total = acc.at(-1)
          const at = (f) => {
            const d = f * total
            let i = 1
            while (i < acc.length - 1 && acc[i] < d) i++
            const k = (d - acc[i - 1]) / (acc[i] - acc[i - 1] || 1)
            return [
              pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k,
              pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k,
            ]
          }
          const d = 'M ' + pts.map((p) => p.map((v) => v.toFixed(1)).join(' ')).join(' L ')
          $('#momentum-guide').setAttribute('d', d)
          $('#momentum-trail').setAttribute('d', d)
          // Stages along the path; labels sit outside the curve.
          const stages = [0.2, 0.47, 0.72]
          const labels = [...root.querySelectorAll('.momentum-label')]
          const svg = $('#momentum-svg')
          const nodes = stages.map((f, i) => {
            const [x, y] = at(f)
            const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
            ring.setAttribute('class', 'momentum-node')
            ring.setAttribute('cx', x)
            ring.setAttribute('cy', y)
            ring.setAttribute('r', 0.9 * u)
            const dot = ring.cloneNode()
            dot.setAttribute('class', 'momentum-lit')
            svg.append(ring, dot)
            gsap.set(labels[i], {
              left: x - 2.6 * u,
              top: y - 2.4 * u,
              xPercent: -100,
              yPercent: -100,
            })
            return { ring, dot, label: labels[i] }
          })
          // The guide draws, the stages appear, the headline lands.
          MK.drawPath(tl, '#momentum-guide', 0.1, 0.9, { ease: MK.ease.move })
          nodes.forEach((n, i) => {
            tl.fromTo(
              n.ring,
              { scale: 0, transformOrigin: '50% 50%' },
              { scale: 1, duration: 0.4, ease: MK.ease.soft },
              0.3 + i * 0.1,
            )
            tl.fromTo(
              n.label,
              { opacity: 0, y: u },
              { opacity: 1, y: 0, duration: 0.5, ease: MK.ease.soft },
              0.35 + i * 0.1,
            )
          })
          MK.revealLines(tl, '#momentum-title', 0.45, { stagger: 0.2 }).forEach((line) => {
            const word = $('#momentum-title').dataset.accent
            if (word && line.textContent.includes(word))
              line.innerHTML = line.textContent.replace(
                word,
                `<span class="mk-accent">${word}</span>`,
              )
          })
          // Momentum: the comet accelerates (power2.in) through every stage and leaves the frame.
          const T0 = 0.75,
            T = 1.6
          const trail = $('#momentum-trail')
          trail.style.strokeDasharray = `${total}`
          const p = { f: 0 }
          const place = () => {
            const [x, y] = at(p.f)
            gsap.set('#momentum-comet', { x, y })
            trail.style.strokeDashoffset = `${total * (1 - p.f)}`
          }
          place()
          tl.fromTo('#momentum-comet', { opacity: 0 }, { opacity: 1, duration: 0.2 }, T0)
          tl.to(p, { f: 1, duration: T, ease: 'power2.in', onUpdate: place }, T0)
          const lit = getComputedStyle(document.documentElement)
            .getPropertyValue('--mk-text')
            .trim()
          nodes.forEach((n, i) => {
            const t = T0 + T * Math.sqrt(stages[i]) // when power2.in reaches the stage
            tl.fromTo(
              n.dot,
              { scale: 0, transformOrigin: '50% 50%' },
              { scale: 1.25, duration: 0.3, ease: MK.ease.soft },
              t,
            )
            tl.to(n.label, { color: lit, duration: 0.2 }, t)
          })
          MK.pushIn(tl, '#momentum-field', 0, 3.1, { to: 1.03 })
          window.__timelines['momentum'] = tl
        })
      </script>
    </template>
  </body>
</html>
