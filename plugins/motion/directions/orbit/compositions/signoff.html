<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #signoff-root {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            60% 60% at 50% 38%,
            color-mix(in srgb, var(--mk-accent) 9%, var(--mk-bg)),
            var(--mk-bg) 70%
          );
        }
        #signoff-glow {
          left: 50%;
          top: 36%;
          margin: calc(var(--u) * -35) 0 0 calc(var(--u) * -35);
        }
        #signoff-lockup {
          position: absolute;
          inset: var(--mk-safe);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: calc(var(--u) * 3.4);
          text-align: center;
        }
        #signoff-markbox {
          position: relative;
          width: calc(var(--u) * 24);
          height: calc(var(--u) * 24);
          margin-bottom: calc(var(--u) * 1);
        }
        .signoff-ring {
          position: absolute;
          left: 50%;
          top: 50%;
          width: calc(var(--u) * 60);
          height: calc(var(--u) * 24);
          margin: calc(var(--u) * -12) 0 0 calc(var(--u) * -30);
          overflow: visible;
        }
        .signoff-ring path {
          fill: none;
          stroke: color-mix(in srgb, var(--mk-accent) 55%, transparent);
          stroke-width: 2;
          stroke-linecap: round;
        }
        #signoff-sat {
          fill: var(--mk-accent);
          filter: drop-shadow(0 0 calc(var(--u) * 1) var(--mk-accent));
        }
        #signoff-back {
          z-index: 0;
        }
        #signoff-front {
          z-index: 2;
        }
        /* The mark: the token's face, flat. Replace with the real logo (inline SVG or <img>). */
        #signoff-mark {
          position: absolute;
          inset: 0;
          z-index: 1;
          width: 100%;
          height: 100%;
          overflow: visible;
          filter: drop-shadow(0 calc(var(--u) * 2) calc(var(--u) * 4) rgba(0, 0, 0, 0.5));
        }
        #signoff-mark polygon {
          stroke: color-mix(in srgb, var(--mk-text) 22%, transparent);
          stroke-width: 0.6;
          stroke-linejoin: round;
        }
        #signoff-title {
          font-size: calc(var(--u) * 8);
          font-weight: 600;
          max-width: none;
        }
        #signoff-cta {
          color: var(--mk-text);
        }
        #signoff-cta b {
          color: var(--mk-accent);
          font-weight: 600;
        }
      </style>
      <div
        id="signoff-root"
        class="mk-scene"
        data-composition-id="signoff"
        data-width="1920"
        data-height="1080"
      >
        <div id="signoff-glow" class="mk-glow"></div>
        <div id="signoff-lockup">
          <div id="signoff-markbox">
            <svg
              id="signoff-back"
              class="signoff-ring"
              viewBox="-300 -120 600 240"
              aria-hidden="true"
            >
              <g transform="rotate(-8)">
                <path id="signoff-back-path" d="M 280 0 A 280 70 0 0 0 -280 0" />
              </g>
            </svg>
            <svg id="signoff-mark" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
            <svg
              id="signoff-front"
              class="signoff-ring"
              viewBox="-300 -120 600 240"
              aria-hidden="true"
            >
              <g transform="rotate(-8)">
                <path id="signoff-front-path" d="M -280 0 A 280 70 0 0 0 280 0" />
                <circle id="signoff-sat" cx="198" cy="49.5" r="9" />
              </g>
            </svg>
          </div>
          <h2 id="signoff-title" class="mk-hero" data-sample>Make your next move.</h2>
          <div id="signoff-cta" class="mk-pill" data-sample>Start free at <b>orbit.app</b></div>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const $ = (s) => document.querySelector(s)
          // The token's face, lit from the upper left like the opening sculpture.
          const deg = Math.PI / 180
          const ring = (r, k) => [
            Math.cos((22.5 + 45 * k) * deg) * r,
            Math.sin((22.5 + 45 * k) * deg) * r,
          ]
          const L = [-0.45, -0.62, 0.64]
          const add = (pts, n) => {
            const d = Math.max(0, n[0] * L[0] + n[1] * L[1] + n[2] * L[2])
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon')
            p.setAttribute('points', pts.map((q) => q.map((v) => v.toFixed(2)).join(',')).join(' '))
            p.style.fill = `color-mix(in srgb, var(--mk-accent) ${(5 + 84 * Math.pow(d, 1.6)).toFixed(1)}%, var(--mk-bg))`
            $('#signoff-mark').append(p)
          }
          for (let k = 0; k < 8; k++) {
            const mid = (45 + 45 * k) * deg
            add(
              [ring(100, k), ring(100, k + 1), ring(60, k + 1), ring(60, k)],
              [
                Math.sin(38 * deg) * Math.cos(mid),
                Math.sin(38 * deg) * Math.sin(mid),
                Math.cos(38 * deg),
              ],
            )
          }
          add(
            [...Array(8)].map((_, k) => ring(60, k)),
            [0, 0, 1],
          )
          // The one spring of the film: the mark pops into place.
          tl.fromTo(
            '#signoff-mark',
            { scale: 0.2, rotation: -60, opacity: 0, transformOrigin: '50% 50%' },
            { scale: 1, rotation: 0, opacity: 1, duration: 0.9, ease: MK.ease.pop },
            0.2,
          )
          tl.fromTo(
            '#signoff-glow',
            { opacity: 0, scale: 0.6 },
            { opacity: 0.9, scale: 1, duration: 1.4, ease: MK.ease.move },
            0.2,
          )
          // The orbit closes around it: back half behind the mark, front half in front.
          MK.drawPath(tl, '#signoff-back-path', 0.45, 0.4, { ease: 'power2.in' })
          MK.drawPath(tl, '#signoff-front-path', 0.85, 0.45, { ease: 'power2.out' })
          tl.fromTo(
            '#signoff-sat',
            { opacity: 0, scale: 0, transformOrigin: '50% 50%' },
            { opacity: 1, scale: 1, duration: 0.35, ease: MK.ease.soft },
            1.2,
          )
          MK.revealWords(tl, '#signoff-title', 0.55)
          tl.fromTo(
            '#signoff-cta',
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.6, ease: MK.ease.soft },
            1.0,
          )
          // Then the frame holds still: the viewer reads the call to action.
          window.__timelines['signoff'] = tl
        })
      </script>
    </template>
  </body>
</html>
