<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Connect</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="blocks/motion-kit.css" />
    <link rel="stylesheet" href="blocks/style.css" />
    <script src="blocks/motion-kit.js"></script>
    <style>
      :root {
        /* 1% of the shorter frame edge; every block and scene sizes from it. */
        --u: 10.8px;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--mk-bg);
      }
      #finish {
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      Connect — an explainer: one item, then three joined by connectors, then gathered into one
      plan. Every scene shares the same diagram grid, so the wipes read as one board turning.
      Retiming a scene: change its data-start/data-duration here and the transition times below.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="find"
        data-composition-id="find"
        data-composition-src="compositions/find.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="join"
        data-composition-id="join"
        data-composition-src="compositions/join.html"
        data-start="2.6"
        data-duration="4"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="step"
        data-composition-id="step"
        data-composition-src="compositions/step.html"
        data-start="6.2"
        data-duration="4.8"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="finish"
        data-composition-id="finish"
        data-composition-src="compositions/finish.html"
        data-start="0"
        data-duration="11"
        data-track-index="9"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true })
      // Wipes in reading direction (left to right) only.
      MK.transition(tl, 'wipe', '#find', '#join', 2.6, { duration: 0.5, direction: 'right' })
      MK.transition(tl, 'wipe', '#join', '#step', 6.2, { duration: 0.5, direction: 'right' })
      window.__timelines['main'] = tl
    </script>
  </body>
</html>
