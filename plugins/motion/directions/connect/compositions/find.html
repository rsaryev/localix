<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #find-root {
          position: absolute;
          inset: 0;
        }
        /* Shared diagram grid (same in find, join, step): node centres at 21/63, 50/47, 79/63 %. */
        #find-root .cx-node {
          position: absolute;
          width: calc(var(--u) * 36);
        }
        #find-n1 {
          left: 21%;
          top: 63%;
        }
        #find-p2 {
          left: 50%;
          top: 47%;
        }
        #find-p3 {
          left: 79%;
          top: 63%;
        }
        #find-root .cx-card {
          box-sizing: border-box;
          height: calc(var(--u) * 25);
          display: flex;
          flex-direction: column;
          gap: calc(var(--u) * 1.2);
          padding: calc(var(--u) * 3);
          border-radius: calc(var(--mk-radius) * 1.2);
          background: var(--mk-text);
          color: var(--mk-bg);
          text-align: left;
          box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 5)
            color-mix(in srgb, var(--mk-bg) 55%, black);
        }
        #find-root .cx-card > * {
          flex: none;
        }
        #find-root .cx-num {
          display: grid;
          place-items: center;
          width: calc(var(--u) * 4.4);
          height: calc(var(--u) * 4.4);
          border-radius: 50%;
          background: var(--mk-accent);
          color: var(--mk-bg);
          font-size: calc(var(--u) * 2);
          font-weight: 750;
        }
        #find-root .cx-name {
          font-size: calc(var(--u) * 4.4);
          font-weight: 750;
          letter-spacing: -0.02em;
        }
        #find-root .cx-text {
          font-size: calc(var(--u) * 2.6);
          line-height: 1.3;
          color: color-mix(in srgb, var(--mk-bg) 78%, var(--mk-text));
        }
        #find-root .cx-ghost {
          height: calc(var(--u) * 25);
          border-radius: calc(var(--mk-radius) * 1.2);
          border: 3px dashed var(--mk-line);
          display: grid;
          place-items: center;
          font-size: calc(var(--u) * 7);
          font-weight: 750;
          color: color-mix(in srgb, var(--mk-text) 45%, var(--mk-bg));
        }
        #find-title {
          position: absolute;
          left: var(--mk-safe);
          top: calc(var(--mk-safe) + var(--u) * 1);
          font-size: calc(var(--u) * 9);
          font-weight: 750;
          max-width: none;
          text-align: left;
        }
      </style>
      <div
        id="find-root"
        class="mk-scene"
        data-composition-id="find"
        data-width="1920"
        data-height="1080"
      >
        <div class="mk-dots"></div>
        <h1 id="find-title" class="mk-hero" data-mark="question" data-sample>Find the question.</h1>
        <div id="find-p2" class="cx-node"><div class="cx-ghost">?</div></div>
        <div id="find-p3" class="cx-node"><div class="cx-ghost">?</div></div>
        <div id="find-n1" class="cx-node">
          <div class="cx-card">
            <span class="cx-num">01</span><span class="cx-name" data-sample>An idea</span
            ><span class="cx-text" data-sample>What if onboarding took one step?</span>
          </div>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const $ = (s) => document.querySelector(s)
          const u =
            parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 10.8
          const ink = getComputedStyle(document.documentElement).getPropertyValue('--mk-bg').trim()
          gsap.set('#find-root .cx-node', { xPercent: -50, yPercent: -50 })
          // The statement, then a marker on the key word (data-mark) once the line has landed.
          const lines = MK.revealLines(tl, '#find-title', 0.2)
          const word = $('#find-title').dataset.mark
          const line = lines.find((l) => word && l.textContent.includes(word))
          if (line) {
            line.innerHTML = line.textContent.replace(word, `<span class="cx-hl">${word}</span>`)
            const hl = line.querySelector('.cx-hl')
            MK.annotate(tl, hl, 1.25, { kind: 'marker' })
            tl.to(hl, { color: ink, duration: 0.2 }, 1.35)
          }
          // The first item arrives on its own; two empty slots wait for the rest of the story.
          tl.fromTo(
            '#find-n1 .cx-card',
            { x: -30 * u, rotation: -6, opacity: 0 },
            { x: 0, rotation: 0, opacity: 1, duration: 0.9, ease: MK.ease.enter },
            0.5,
          )
          tl.fromTo(
            '#find-root .cx-ghost',
            { opacity: 0, scale: 0.92 },
            { opacity: 1, scale: 1, duration: 0.6, ease: MK.ease.soft, stagger: 0.12 },
            0.95,
          )
          window.__timelines['find'] = tl
        })
      </script>
    </template>
  </body>
</html>
