<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #join-root {
          position: absolute;
          inset: 0;
        }
        #join-root .cx-node {
          position: absolute;
          width: calc(var(--u) * 36);
        }
        #join-n1 {
          left: 21%;
          top: 63%;
        }
        #join-n2 {
          left: 50%;
          top: 47%;
        }
        #join-n3 {
          left: 79%;
          top: 63%;
        }
        #join-root .cx-card {
          box-sizing: border-box;
          height: calc(var(--u) * 25);
          display: flex;
          flex-direction: column;
          gap: calc(var(--u) * 1.2);
          padding: calc(var(--u) * 3);
          border-radius: calc(var(--mk-radius) * 1.2);
          background: var(--mk-text);
          color: var(--mk-bg);
          text-align: left;
          box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 5)
            color-mix(in srgb, var(--mk-bg) 55%, black);
        }
        #join-root .cx-card > * {
          flex: none;
        }
        #join-root .cx-num {
          display: grid;
          place-items: center;
          width: calc(var(--u) * 4.4);
          height: calc(var(--u) * 4.4);
          border-radius: 50%;
          background: var(--mk-accent);
          color: var(--mk-bg);
          font-size: calc(var(--u) * 2);
          font-weight: 750;
        }
        #join-root .cx-name {
          font-size: calc(var(--u) * 4.4);
          font-weight: 750;
          letter-spacing: -0.02em;
        }
        #join-root .cx-text {
          font-size: calc(var(--u) * 2.6);
          line-height: 1.3;
          color: color-mix(in srgb, var(--mk-bg) 78%, var(--mk-text));
        }
        #join-wires {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        #join-wires path {
          fill: none;
          stroke: var(--mk-text);
          stroke-width: 4;
          stroke-linecap: round;
        }
        #join-wires circle {
          fill: var(--mk-accent);
          stroke: var(--mk-bg);
          stroke-width: 3;
        }
        #join-title {
          position: absolute;
          left: var(--mk-safe);
          top: calc(var(--mk-safe) + var(--u) * 1);
          font-size: calc(var(--u) * 9);
          font-weight: 750;
          max-width: none;
          text-align: left;
        }
      </style>
      <div
        id="join-root"
        class="mk-scene"
        data-composition-id="join"
        data-width="1920"
        data-height="1080"
      >
        <div class="mk-dots"></div>
        <h1 id="join-title" class="mk-hero" data-mark="dots" data-sample>Join the dots.</h1>
        <div id="join-n1" class="cx-node">
          <div class="cx-card">
            <span class="cx-num">01</span><span class="cx-name" data-sample>An idea</span
            ><span class="cx-text" data-sample>What if onboarding took one step?</span>
          </div>
        </div>
        <div id="join-n2" class="cx-node">
          <div class="cx-card">
            <span class="cx-num">02</span><span class="cx-name" data-sample>An insight</span
            ><span class="cx-text" data-sample>Most people stop at step three.</span>
          </div>
        </div>
        <div id="join-n3" class="cx-node">
          <div class="cx-card">
            <span class="cx-num">03</span><span class="cx-name" data-sample>A plan</span
            ><span class="cx-text" data-sample>Ship a one-step trial in May.</span>
          </div>
        </div>
        <svg id="join-wires" aria-hidden="true">
          <path id="join-w1" d="M0 0" />
          <path id="join-w2" d="M0 0" />
        </svg>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const $ = (s) => document.querySelector(s)
          const NS = 'http://www.w3.org/2000/svg'
          const u =
            parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 10.8
          const ink = getComputedStyle(document.documentElement).getPropertyValue('--mk-bg').trim()
          gsap.set('#join-root .cx-node', { xPercent: -50, yPercent: -50 })
          // Connector geometry from the laid-out cards: right edge of one to left edge of the next.
          // Deterministic grid (no layout reads): card 36u × 25u, centres as in the CSS above.
          const root = $('#join-root')
          const W = +root.dataset.width,
            H = +root.dataset.height
          const box = ([fx, fy]) => ({
            x: W * fx - 18 * u,
            y: H * fy - 12.5 * u,
            w: 36 * u,
            h: 25 * u,
          })
          const [b1, b2, b3] = [
            [0.21, 0.63],
            [0.5, 0.47],
            [0.79, 0.63],
          ].map(box)
          const wire = (path, a, z) => {
            const k = (z.x - a.x) * 0.5
            $(path).setAttribute(
              'd',
              `M ${a.x} ${a.y} C ${a.x + k} ${a.y} ${z.x - k} ${z.y} ${z.x} ${z.y}`,
            )
            return [a, z].map((p) => {
              const c = document.createElementNS(NS, 'circle')
              c.setAttribute('cx', p.x)
              c.setAttribute('cy', p.y)
              c.setAttribute('r', 0.9 * u)
              $('#join-wires').append(c)
              return c
            })
          }
          const e1 = wire(
            '#join-w1',
            { x: b1.x + b1.w, y: b1.y + b1.h / 2 },
            { x: b2.x, y: b2.y + b2.h / 2 },
          )
          const e2 = wire(
            '#join-w2',
            { x: b2.x + b2.w, y: b2.y + b2.h / 2 },
            { x: b3.x, y: b3.y + b3.h / 2 },
          )
          // Items 02 and 03 arrive separately, in reading order, while the wipe reveals them.
          tl.fromTo(
            '#join-n2 .cx-card',
            { y: -10 * u, rotation: 4, opacity: 0 },
            { y: 0, rotation: 0, opacity: 1, duration: 0.8, ease: MK.ease.enter },
            0.15,
          )
          tl.fromTo(
            '#join-n3 .cx-card',
            { y: -10 * u, rotation: -4, opacity: 0 },
            { y: 0, rotation: 0, opacity: 1, duration: 0.8, ease: MK.ease.enter },
            0.32,
          )
          // Then the dots join: each connector draws from its source, its ends land.
          ;[
            [e1, '#join-w1', 0.55],
            [e2, '#join-w2', 0.8],
          ].forEach(([ends, path, at]) => {
            tl.fromTo(
              ends[0],
              { scale: 0, transformOrigin: '50% 50%' },
              { scale: 1, duration: 0.25, ease: MK.ease.soft },
              at,
            )
            MK.drawPath(tl, path, at + 0.05, 0.45)
            tl.fromTo(
              ends[1],
              { scale: 0, transformOrigin: '50% 50%' },
              { scale: 1, duration: 0.3, ease: MK.ease.soft },
              at + 0.45,
            )
          })
          const lines = MK.revealLines(tl, '#join-title', 0.05)
          const word = $('#join-title').dataset.mark
          const line = lines.find((l) => word && l.textContent.includes(word))
          if (line) {
            line.innerHTML = line.textContent.replace(word, `<span class="cx-hl">${word}</span>`)
            const hl = line.querySelector('.cx-hl')
            MK.annotate(tl, hl, 0.95, { kind: 'marker' })
            tl.to(hl, { color: ink, duration: 0.2 }, 1.05)
          }
          window.__timelines['join'] = tl
        })
      </script>
    </template>
  </body>
</html>
