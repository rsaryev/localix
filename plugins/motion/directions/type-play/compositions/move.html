<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #move-root {
          position: absolute;
          inset: 0;
        }
        /* Poster grammar shared by every scene: fitted lines, a hot slab, tracked labels. */
        .tp-type {
          width: fit-content;
          white-space: nowrap;
          font-family: var(--mk-display);
          font-weight: var(--mk-display-weight);
          text-transform: var(--mk-display-case);
          letter-spacing: var(--mk-display-tracking);
          font-size: calc(var(--u) * 10);
          line-height: 0.8;
        }
        .tp-slab {
          overflow: hidden;
          background: var(--mk-accent);
          color: var(--mk-text);
        }
        .tp-slab .tp-type {
          padding: 0.06em 0;
        }
        .tp-labels {
          display: flex;
          justify-content: space-between;
          overflow: hidden;
          font-size: var(--mk-label);
          font-weight: 800;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          line-height: 1.2;
          flex: none;
        }
        .tp-labels > * {
          display: inline-block;
        }
        /* Inverted on the cut: black ground, acid type, the hot dot. */
        #move-root {
          background: var(--mk-text);
          color: var(--mk-bg);
        }
        #move-frame {
          position: absolute;
          inset: var(--mk-safe);
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
        #move-labels {
          color: var(--mk-bg);
        }
        #move-stage {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #move-word .mk-char {
          transform-origin: 50% 100%;
        }
        #move-word .tp-hot {
          color: var(--mk-accent);
        }
      </style>
      <div
        id="move-root"
        class="mk-scene"
        data-composition-id="move"
        data-width="1920"
        data-height="1080"
      >
        <div id="move-frame">
          <div id="move-labels" class="tp-labels">
            <span data-sample>02</span>
            <span data-sample>Keep it moving</span>
          </div>
          <div id="move-stage">
            <div id="move-word" class="tp-type" data-sample>Move.</div>
          </div>
        </div>
      </div>
      <script>
        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true })
          const BEAT = 0.4
          // Fit a nowrap line to a width. Three passes: system fonts change width with optical size.
          const fit = (el, width) => {
            for (let pass = 0; pass < 3; pass++) {
              const size = parseFloat(getComputedStyle(el).fontSize)
              el.style.fontSize = `${(size * width) / el.offsetWidth}px`
            }
          }
          const root = document.querySelector('#move-root')
          const word = document.querySelector('#move-word')
          // Split first, then fit: split letters lose their kerning, so measure them as they render.
          const chars = [...MK.split(word, 'chars').querySelectorAll('.mk-char')]
          const W = MK.withLayout(root, () => {
            // 94%: room for the lean on beat 1.
            fit(word, document.querySelector('#move-stage').offsetWidth * 0.94)
            return root.offsetWidth
          })
          // Punctuation takes the hot colour.
          chars.filter((c) => /[.!?]/.test(c.textContent)).forEach((c) => c.classList.add('tp-hot'))
          const odd = chars.filter((_, i) => i % 2)
          const even = chars.filter((_, i) => !(i % 2))
          // Beat 0: the letters skid in from the right, leaning into the move.
          tl.fromTo(
            chars,
            { x: W * 0.55, skewX: -24 },
            { x: 0, skewX: 0, duration: 0.36, ease: 'expo.out', stagger: 0.03 },
            0,
          )
          tl.fromTo(
            '#move-labels > *',
            { yPercent: 110 },
            { yPercent: 0, duration: 0.3, ease: 'expo.out', stagger: 0.05 },
            0.1,
          )
          // Beats 1 and 2: the word leans and the letters step up and down, then swap.
          tl.fromTo(word, { skewX: 0 }, { skewX: -12, duration: 0.16, ease: 'power4.out' }, BEAT)
          tl.fromTo(
            odd,
            { yPercent: 0 },
            { yPercent: -7, duration: 0.16, ease: 'power4.out' },
            BEAT,
          )
          tl.fromTo(
            even,
            { yPercent: 0 },
            { yPercent: 5, duration: 0.16, ease: 'power4.out' },
            BEAT,
          )
          tl.to(word, { skewX: 0, duration: 0.16, ease: 'power4.out' }, BEAT * 2)
          tl.to(odd, { yPercent: 5, duration: 0.16, ease: 'power4.out' }, BEAT * 2)
          tl.to(even, { yPercent: -7, duration: 0.16, ease: 'power4.out' }, BEAT * 2)
          // Beat 3: everything snaps level as the frame is pushed out (index.html).
          tl.to(chars, { yPercent: 0, duration: 0.16, ease: 'power4.out' }, BEAT * 3)
          window.__timelines['move'] = tl
        })
      </script>
    </template>
  </body>
</html>
